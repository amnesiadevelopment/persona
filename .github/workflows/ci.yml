name: ci

# Run the test suite BEFORE a change lands, not after — on every OS persona
# ships to, and with a real browser engine actually launched.
#
# release.yml runs the same suite, but only on a version-tag push — by which
# point the change is already on main and headed into every consumer's next
# update (persona self-updates, so a broken copy replaces a working one before
# anyone gets a chance to notice). This workflow is that suite moved to the
# front of the pipeline: a pull request is checked before it can be merged, and
# a push straight to main is checked too, so a path that bypasses review does
# not also bypass verification.
#
# WHY THREE PLATFORMS (PS-60). persona ships to Linux, Windows and macOS, and
# until this matrix existed exactly one of them had ever executed a test.
# Everything the project believed about Windows or macOS behaviour was
# inference from source. The interesting result here is deliberately NOT "green
# everywhere" — it is "this holds on Linux and does not hold on Windows", and
# the matrix exists to make that difference visible before a merge rather than
# after a release. See "THE FAILURE FLOOR" below: the three floors differ, and
# they are reported rather than flattened.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Default to READ-only, matching the posture release.yml documents in place:
# these jobs install and execute untrusted third-party code (git-dep setup.py,
# the engine packages) and must not hold a write-capable token that code could
# exfiltrate. Nothing here writes to the repo, so nothing needs widening.
#
# This stance is INHERITED by everything added for the three-platform matrix and
# the browser job — downloading a Firefox binary and launching it needs no token
# at all, so nothing here widens the default.
permissions:
  contents: read

# A superseded run proves nothing about the tip of the branch. Cancel it and
# keep the runner for the commit people are actually waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      # Never cancel the other platforms because one went red. The whole point
      # of the matrix is the COMPARISON between platforms, and fail-fast throws
      # away exactly the rows that make a divergence legible.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Measured per platform (see the floor table below): ubuntu 107s,
    # macOS 110s, Windows 225-245s. Windows is ~2x the others and is the reason
    # this is 30 rather than 20. All three are inside the window where people
    # wait for a check rather than learning to merge past it, so the gate runs
    # the WHOLE suite: no -k narrowing, no --deselect, no "fast subset". If it
    # ever grows slow enough to tempt someone, split it by measuring again and
    # gating on a stated portion — do not quietly start skipping tests here.
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        # PINNED DELIBERATELY. Parts of this suite drive the generated cloak
        # scripts through a real JS engine, so `node` is a dependency of the
        # tests whether or not it appears in pyproject — but nothing pinned it,
        # and the version was whatever the runner image happened to ship. That
        # drifted from 20 to 24 underneath the project and turned a green suite
        # red (see the Node note under "Run the test suite"). An unpinned engine
        # means the gate can change its answer with no change to this repo,
        # which is the one thing a merge gate must never do.
        #
        # Keep this in step with release.yml's `tests` job, for the same reason
        # the install step is identical there: two gates, one definition.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      - name: Report what this machine actually is
        # The macOS runner is ARM (measured: macOS 26.5.2 arm64, Python
        # 3.13.14), while the engine pins and much of this project's history
        # assume x86_64. That is not a problem to solve here, but it IS a fact
        # every reader of a macOS failure needs in front of them, so the job
        # states it rather than leaving the next person to guess.
        shell: bash
        run: |
          python -c "import platform, sys; print('platform:', platform.platform()); print('machine :', platform.machine()); print('python  :', sys.version)"
          node --version
          echo "DISPLAY=[${DISPLAY:-<unset>}]"

      - name: Install deps
        # Deliberately IDENTICAL to release.yml's `tests` job. The two gates
        # must not drift into two different definitions of "the suite" — if
        # this one installs a different dependency set, a change can pass here
        # and fail at the tag, which is exactly the late-discovery problem this
        # workflow exists to remove. Change both or neither.
        #
        # Install the project from pyproject (NOT requirements.txt) so the suite
        # runs against the EXACT dependency set the build bundles.
        #
        # MEASURED ON ALL THREE PLATFORMS: this exact sequence succeeds on
        # ubuntu-24.04 (x86_64), windows-latest (AMD64) and macos-latest
        # (arm64). The macOS ARM question was settled by running it, not by
        # assuming the pins would resolve.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary .
          # Surfaces a version conflict (e.g. invisible_playwright's pinned
          # invisible_core drifting from pyproject's == pin) as a clear message
          # rather than as a pile of confusing test failures.
          pip check
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      - name: Provision the browser engine
        # THE FIRST TIME A REAL ENGINE HAS EVER BEEN LAUNCHED BY THIS PROJECT'S
        # AUTOMATION. tests/test_ff_language_override.py carries a fixture that
        # launches a genuine Firefox and sweeps the realm for any function that
        # betrays itself by shape. The assertion was already written and already
        # strong; it had simply never executed anywhere, because the browser
        # BINARY was never provisioned. This step is that provisioning.
        #
        # `pip install .` supplies the playwright PACKAGE (invisible_playwright
        # hard-depends on upstream playwright), so the import guard passes
        # wherever deps are installed — it is the BINARY that was missing, and
        # this is the step that supplies it.
        #
        # NO DISPLAY SERVER IS INSTALLED, AND THAT IS A MEASURED RESULT, NOT AN
        # ASSUMPTION. A headless Firefox was launched on all three runners with
        # DISPLAY deliberately unset and reported a working page on each
        # (Firefox 151 on every platform). Provisioning Xvfb "just in case"
        # would add a moving part that nothing needs; assuming headless works
        # when it does not would fail for a reason unrelated to the product.
        # It was measured: headless suffices, on all three.
        shell: bash
        run: python -m playwright install firefox

      - name: Run the test suite
        # THE ENVIRONMENT DECLARES WHAT IT SUPPLIES — IT IS NEVER INFERRED.
        #
        # This job has just provisioned a browser, so it SAYS SO, and from that
        # moment a browser probe that declines to run is a FAILURE naming what
        # was missing rather than a skip nobody reads. That is PS-58's
        # mechanism (conftest.py), consumed here rather than re-invented; this
        # workflow deliberately introduces no second vocabulary for "did not
        # run".
        #
        # The declaration is an explicit environment variable BECAUSE the
        # tempting shortcut — "playwright imported, therefore this machine
        # supports browser tests" — re-creates the original defect one level
        # up: it concludes "unsupported here" on precisely the machine where
        # support broke, which is the one case that must be loud. Nothing reads
        # the presence of the thing being checked.
        #
        # ---------------------------------------------------------------------
        # THE FAILURE FLOOR, MEASURED PER PLATFORM, WITH ITS PROVENANCE ATTACHED
        # ---------------------------------------------------------------------
        # A floor figure without provenance is the defect this section exists to
        # prevent. An earlier revision reported DEV CONTAINER figures while
        # describing them as measured "on this runner image", and concluded that
        # any red must be the developer's own. The runner disproved that on the
        # very first run. Stale figures were survivable; false provenance was
        # not, because this is the sentence the next reader trusts when deciding
        # whether they broke something. So every figure below names WHERE it was
        # taken.
        #
        #   ON THIS RUNNER (ubuntu-24.04, x86_64, run 32538852334):
        #     0 failed, 2487 passed, 14 skipped, 107s          <- THE LINUX FLOOR
        #
        #   ON THIS RUNNER (macos-latest, arm64, run 32538852334):
        #     0 failed, 2472 passed, 29 skipped, 110s          <- THE MACOS FLOOR
        #     First measurement ever taken of this suite on macOS.
        #
        #   ON THIS RUNNER (windows-latest, AMD64, runs 32538852334/32539306321):
        #     22 failed, 2446 passed, 33 skipped, 225-245s   <- THE WINDOWS FLOOR
        #     First measurement ever taken of this suite on Windows. NOT zero;
        #     see the seven causes below.
        #
        #   ON THIS RUNNER (ubuntu-24.04, BEFORE the Node pin, run 32531702342):
        #     1 failed, 2454 passed, 14 skipped, 107s
        #     Kept as the before/after pair for the Node pin below — the single
        #     failure was NOT caused by the change under test.
        #
        #   IN A DEV CONTAINER (python 3.13 via uv, node pinned to 24 by hand):
        #     bare interpreter, deps NOT installed : 42 failed, 2321 passed
        #     after the install step above         :  0 failed, 2398 passed, 120s
        #     Every one of the 42 was a missing-dependency failure the install
        #     step provides. Useful ONLY as a bare-vs-installed COMPARISON.
        #
        # INHERITED SINCE THOSE FLOORS WERE MEASURED (+1 ON EVERY PLATFORM):
        #     tests/test_verify_engine_gate.py::
        #       test_installed_core_version_answers_empty_when_absent
        #     AssertionError: assert '20.14.0' == ''    <- THE INHERITED RED
        #
        # It arrived on main with PS-50 (4f94721), AFTER the floors above were
        # taken, so today every platform runs at its floor PLUS this one:
        # ubuntu 0+1, macos 0+1, windows 22+1 = 23. The arithmetic is exact and
        # is the reason it can be stated as inherited rather than suspected.
        #
        # IT IS NOT A REGRESSION FROM THIS WORKFLOW, AND THE PROOF IS ON MAIN:
        # main's own tip (fc27868, run 32544633376) fails this same single test
        # with the same message, on a job that predates this matrix. Anything
        # this workflow did would not show up there.
        #
        # THE CAUSE, so nobody re-derives it: installed_core_version() reads
        # importlib.metadata for `invisible_core` and returns "" when absent.
        # The test's own docstring records the assumption it rests on — "is
        # genuinely absent in this container" — and a GitHub runner is not that
        # container: pyproject pins invisible_core==20.14.0, the install step
        # installs it, so metadata resolves and the test gets a version where it
        # demanded emptiness. An environment assumption, not a masking defect.
        #
        # DELIBERATELY NOT FIXED HERE, and not allowlisted either. Repairing an
        # unrelated test to make this job green is the exact move the rest of
        # this section argues against; it belongs to whoever owns PS-50. It is
        # recorded so the next reader can tell an inherited red from their own
        # without re-running anything — which is this whole section's purpose.
        #
        # THE TWO NUMBERS DO NOT MATCH, DELIBERATELY LEFT VISIBLE: the runners
        # collect more tests than the container, and the three runners do not
        # agree with each other either (2487 / 2472 / 2446 collected-and-passed,
        # on platform-gated tests). So no container figure is a stand-in for a
        # runner figure, and no ONE platform's figure is a stand-in for
        # another's. Anyone re-measuring a floor must do it on that platform's
        # runner.
        #
        # THE WINDOWS FLOOR IS NOT ZERO, AND IT IS NOT BEING HIDDEN. Those 22
        # are pre-existing and unrelated to any change gated here — they are the
        # first measurement anyone has ever taken of this suite on Windows, and
        # they are the whole reason this matrix exists. They fall into seven
        # causes, none of which is a flake:
        #
        #   os.fork / os.geteuid absent on Windows (4)
        #     test_browser_env_policy.py x3, test_cert_terminator.py x1
        #   file mode asserted 0o600 but read back 0o666 (2)
        #     test_trash_store.py, test_trash_stores.py  <-- SEE BELOW
        #   an unwritable path does not raise OSError on Windows (2)
        #     test_verify_snapshot.py
        #   cp1252 default encoding on file reads (3)
        #     test_locale_ext.py — UnicodeDecodeError: 'charmap' codec
        #   a socket is opened where the POSIX path opens none (3)
        #     test_rotate_through_proxy.py x2, test_proxy_checker_lanes.py x1
        #   engine install/restore sentinel behaviour differs (4)
        #     test_engine_ensure.py
        #   path/text comparison differences (4)
        #     test_title_ext.py x2, test_verify_baseline.py, test_rotate_* x1
        #
        # AT LEAST TWO OF THOSE ARE SECURITY-RELEVANT RATHER THAN COSMETIC and
        # are reported, not repaired, here: the trash-store files that must be
        # owner-only are world-readable (0o666) on Windows, and a proxy lane
        # that must refuse to open a socket opens one. Both are exactly the
        # "holds on Linux, does not hold on Windows" finding this matrix was
        # built to surface. Fixing them is NOT this workflow's job and was
        # explicitly out of scope for the ticket that added it; they belong to
        # the product, and the honest move is to make them visible on every PR
        # until someone owns them.
        #
        # NO ALLOWLIST IS CONFIGURED, ON ANY PLATFORM, AND THAT IS DELIBERATE.
        # A list of "known" failures is precisely how a real regression gets
        # waved through, and it is also how a floor becomes permanent: the 22
        # would stop being a debt anyone can see and start being scenery. The
        # Windows job is therefore RED at its measured floor, on purpose, and
        # will stay red until the product is fixed — which is a statement about
        # persona on Windows, not about this gate. Do not silence it, do not
        # mark the platform continue-on-error (that would hide NEW Windows
        # regressions too, which is the allowlist defect at job scale), and do
        # not "fix" unrelated tests to improve the number.
        #
        # WHY THE NODE PIN ABOVE EXISTS. Node 21+ defines `navigator` as a
        # getter-only accessor, so a sloppy-mode assignment over it is a SILENT
        # no-op. tests/test_ff_language_override.py's harness installed its stub
        # that way; on the runner's Node the stub was never installed and the
        # test read the host's real locale, while a Node 20 machine stayed
        # green. Nothing in this repo pinned Node, so the gate could change its
        # answer with no change to the repo. Fixed at source (defineProperty)
        # and pinned here — this gate found a real, live bug on its first run.
        #
        # Reported, not laundered: two tests that stand up real sockets/TLS with
        # timeouts (tests/test_cert_manager.py::test_session_end_to_end and
        # tests/test_cert_terminator.py::test_terminator_presents_cert_to_admin_host)
        # were seen failing intermittently under full-suite load in an earlier
        # session, and were reproduced failing on an unmodified main as a
        # control, so they are pre-existing and unrelated to any change gated
        # here. They are NOT allowlisted and NOT fixed. If one trips a PR,
        # re-run it and file it — do not add it to a skip list.
        shell: bash
        env:
          PERSONA_REQUIRED_CAPABILITIES: browser
        run: python -m pytest -q

      - name: GPU reading (known-environmental, never a pass)
        # A hosted runner has no GPU, so WebGL renders in software. A persona
        # profile that declares a discrete GPU over a software-rendered canvas
        # is an IMPOSSIBLE PAIR — and the masking charter classifies that as a
        # HOST-FACT LEAK (the deployment environment reaching through the mask),
        # not as a configuration mistake. On this infrastructure that pair is
        # present BY CONSTRUCTION, on every run, permanently.
        #
        # It is therefore TAGGED, not fixed and not hidden: recorded with its
        # reason, never counted as a pass (the script asserts nothing and always
        # exits 0), and never raised as a new defect. `if: always()` so it
        # cannot vanish from the record just because the suite above went red —
        # the Windows job is red at its floor, and this reading must survive it.
        #
        # Nothing here installs a driver or forces a renderer string. Doing so
        # would corrupt the one reading this environment genuinely cannot give.
        if: always()
        shell: bash
        run: python .github/scripts/report_runner_gpu.py
