name: ci

# Run the test suite BEFORE a change lands, not after — on every OS persona
# ships to, and with a real browser engine actually launched.
#
# release.yml runs the same suite, but only on a version-tag push — by which
# point the change is already on main and headed into every consumer's next
# update (persona self-updates, so a broken copy replaces a working one before
# anyone gets a chance to notice). This workflow is that suite moved to the
# front of the pipeline: a pull request is checked before it can be merged, and
# a push straight to main is checked too, so a path that bypasses review does
# not also bypass verification.
#
# WHY THREE PLATFORMS (PS-60). persona ships to Linux, Windows and macOS, and
# until this matrix existed exactly one of them had ever executed a test.
# Everything the project believed about Windows or macOS behaviour was
# inference from source. The interesting result here is deliberately NOT "green
# everywhere" — it is "this holds on Linux and does not hold on Windows", and
# the matrix exists to make that difference visible before a merge rather than
# after a release. See "THE FAILURE FLOOR" below: the three floors differ, and
# they are reported rather than flattened.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Default to READ-only, matching the posture release.yml documents in place:
# these jobs install and execute untrusted third-party code (git-dep setup.py,
# the engine packages) and must not hold a write-capable token that code could
# exfiltrate. Nothing here writes to the repo, so nothing needs widening.
#
# This stance is INHERITED by everything added for the three-platform matrix and
# the browser job — downloading a Firefox binary and launching it needs no token
# at all, so nothing here widens the default.
permissions:
  contents: read

# A superseded run proves nothing about the tip of the branch. Cancel it and
# keep the runner for the commit people are actually waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: types
    # SEPARATE FROM THE MATRIX, DELIBERATELY. Type checking reads source text;
    # it does not execute the product, so its answer is identical on all three
    # platforms. Running it three times would triple the cost to learn the same
    # fact, and — worse — would report one type error as three red cells, which
    # reads like a platform divergence when it is nothing of the kind.
    #
    # This job carries BOTH type checks, and they are deliberately ASYMMETRIC.
    # That asymmetry is the whole point (PS-165), so read it before changing
    # either step:
    #
    #   * the repo-wide mypy run is ADVISORY — it prints and cannot fail the
    #     build, because the tree still carries pre-existing errors;
    #   * the protocol-conformance check is GATING — it is narrow, it is clean
    #     today, and its red is a real red.
    #
    # Flipping the first to gating would make this job permanently red, and the
    # reflex cure for that (a blanket `ignore_errors`) is precisely the defect
    # this job was created to remove. Flipping the second to advisory would
    # leave a job that reports everything and blocks nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the type checker
        # ONLY the dev requirements, NOT the project. mypy.ini sets
        # `no_site_packages`, so the run deliberately does not look at
        # installed third-party packages at all — installing the project would
        # cost minutes and change nothing about the result. See mypy.ini for
        # why that setting is required rather than preferred.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Protocol conformance (gating)
        # THE NARROW GATE — the one that can actually fail this build.
        #
        # It fails when a Protocol stops describing its implementation. That is
        # a real defect class here: at PS-165 IProfileManager had fallen ten
        # parameters behind ProfileManager.add_profile and eight behind
        # update_profile, and callers were passing arguments the protocol never
        # declared — 38 of the repo's then-136 mypy errors from that one cause.
        #
        # DO NOT "simplify" this into a mypy check. That was tried and measured:
        # with the duplicate `set_cookie_status` declaration removed and the
        # parameter drift left fully intact, mypy reports ZERO errors for this
        # drift, because a Protocol permits an implementation to accept extra
        # OPTIONAL parameters, which is the exact direction this drift ran. The
        # gate would have shipped vacuously green. (On the pristine tree the
        # probe DOES error, but on the duplicate declaration rather than on the
        # drift — re-run it the way the script's docstring specifies or you will
        # misread that error as mypy catching this class.)
        # The reasoning is written out at the top of the script.
        #
        # Runs BEFORE the advisory step so its verdict is not buried under the
        # advisory run's many lines of pre-existing output.
        shell: bash
        run: python .github/scripts/check_protocol_conformance.py

      - name: Type check, repo-wide (advisory)
        # ADVISORY ON PURPOSE — a red here does NOT block a merge. The tree
        # still carries pre-existing errors — read the count from this step's
        # own output, or reproduce it with the config alone
        # (`python -m mypy --config-file mypy.ini src`) rather than trusting a
        # figure written here. A gate that is red before anyone touches it
        # teaches people to ignore it.
        #
        # NOT `continue-on-error`. This step is made non-gating the same way the
        # GPU reading below is: it CATCHES the exit status and reports it, so
        # the step genuinely SUCCEEDS rather than failing-but-excused. That
        # distinction is not style — tests/test_ci_verification_gates.py forbids
        # `continue-on-error` anywhere in this workflow, because at JOB scale it
        # is how an entire platform quietly stops being verified. Keeping that
        # rule absolute is worth far more than the one line it costs here.
        #
        # It runs so the number is VISIBLE and so a change that makes it much
        # worse is legible in the log. `if: always()` so the reading survives a
        # red conformance gate above — that is exactly when it is most useful.
        #
        # EVERY FLAG THIS NEEDS LIVES IN mypy.ini, not on this line, so a
        # developer running `python -m mypy --config-file mypy.ini src` locally
        # gets the same answer this step does.
        #
        # To make this gating, fix the errors — do not add `ignore_errors`.
        if: always()
        shell: bash
        run: |
          # `set -e` is on by default in this shell, and mypy exits non-zero
          # whenever it finds anything — so the call is guarded, or the step
          # would die before reporting the count that is the point of running.
          status=0
          python -m mypy --config-file mypy.ini src || status=$?
          echo "advisory: mypy exit status ${status} (this step cannot fail the build)"

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.shard.name }})
    strategy:
      # Never cancel the other platforms because one went red. The whole point
      # of the matrix is the COMPARISON between platforms, and fail-fast throws
      # away exactly the rows that make a divergence legible. The same argument
      # now applies across SHARDS: a ui-driver failure must not cancel the main
      # shard that would have told you whether anything else broke.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        # ── THE SPLIT (PS-313) — TWO GATING PORTIONS, NOT A FAST SUBSET ─────
        # Read `marker` as a PARTITION of the suite, not as a filter on it.
        # Both shards run on every platform and BOTH must pass, so their union
        # is exactly the suite that ran before this split. Verified by
        # collection, not asserted:
        #
        #   pytest --collect-only                     -> 5566
        #   pytest --collect-only -m ui_driver        ->   15   (5551 deselected)
        #   pytest --collect-only -m "not ui_driver"  -> 5551   (  15 deselected)
        #   15 + 5551 == 5566  ✅
        #
        # That arithmetic is the whole safety argument, so it is PINNED by
        # tests/test_ci_shard_partition.py rather than left to this comment. A
        # test that matched NEITHER marker expression would vanish from the
        # gate silently while both jobs stayed green — which is the exact
        # "invisibly-false green" this file's own rule below forbids, and it is
        # the only way this change could go wrong.
        # `capabilities` is the PERSONA_REQUIRED_CAPABILITIES declaration for
        # this shard. It rides the matrix beside `marker` because the two are
        # the same decision seen twice: the marker says WHICH tests this shard
        # runs, and the declaration says which of their skips this shard
        # REFUSES TO ACCEPT SILENTLY.
        #
        # ⚠️ NOT the same value on both shards, and not `ui_driver` alone:
        # `expand_capabilities(["ui_driver"])` is `["ui_driver"]` — it does NOT
        # cover `browser`. Declaring it on the MAIN shard would stop policing
        # browser skips across all ~5,555 of its tests, which is the exact
        # silent-green this split exists to prevent, one axis over.
        shard:
          - name: main
            marker: "not ui_driver"
            capabilities: browser
          - name: ui-driver
            marker: "ui_driver"
            capabilities: browser,ui_driver
    runs-on: ${{ matrix.os }}
    # ⚠️ THE CAP IS STILL 30. THIS SPLIT DELIBERATELY DID NOT RAISE IT.
    #
    # The figures this cap was originally set from (ubuntu 107s, macOS 110s,
    # Windows 225-245s — see the floor table below) are from the FIRST-EVER
    # measurement of this suite and are now historical: they describe a suite
    # roughly a sixth of the current size. Re-measured 2026-09-05 on `main`
    # @ 62e0b91, and this is what the split is sized against:
    #
    #   whole suite, locally, as CI runs it   2037s (33m57s)  <- OVER the wall
    #   last GREEN ubuntu leg (8fbc38b)       1656s (27m36s)  <- 83s of margin
    #     same run, macOS                      825s (13m44s)
    #     same run, Windows                   1110s (18m30s)
    #
    # WHY ONE PLATFORM AND NOT THREE: `/usr/bin/chromium` exists only on the
    # ubuntu runner, so the ui_driver tier RUNS on Linux and SKIPS on the other
    # two ("chromium not runnable here" in their skip reasons). Windows
    # finishing in 18m was never evidence that Linux was misbehaving — it is
    # evidence that Windows was not running this tier at all.
    #
    # Measured composition of the 2037s (`--durations`), which is what makes
    # the seam the right one:
    #
    #   ui_driver tier (15 tests, 3 files)     813s   39.9%   -> the ui-driver shard
    #   test_ps185_patch_provenance.py         567s   27.8%   -> stays in main
    #   everything else                        657s   32.3%
    #
    # So after the split the worst shard on the worst platform is ~14m against
    # a 30m cap — better than 2x margin, where the combined job had 1.09x and
    # then lost it. RAISING the cap instead would have been the wrong move:
    # margin across 41 green runs fell 439s -> 12s in two days (PS-13), so a
    # cap fitted to today's suite gets eaten by the same trend that ate this
    # one. Splitting buys headroom that a growing suite consumes half as fast;
    # a bigger number buys time until the next ticket.
    #
    # THE RULE BELOW IS UNCHANGED AND STILL BINDING. Each shard runs its whole
    # portion: no -k narrowing, no --deselect of individual tests, no "fast
    # subset", and NEITHER shard is optional. If this needs splitting again,
    # split it by measuring again and gating on a stated portion — do not
    # quietly start skipping tests here.
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        # PINNED DELIBERATELY. Parts of this suite drive the generated cloak
        # scripts through a real JS engine, so `node` is a dependency of the
        # tests whether or not it appears in pyproject — but nothing pinned it,
        # and the version was whatever the runner image happened to ship. That
        # drifted from 20 to 24 underneath the project and turned a green suite
        # red (see the Node note under "Run the test suite"). An unpinned engine
        # means the gate can change its answer with no change to this repo,
        # which is the one thing a merge gate must never do.
        #
        # Keep this in step with release.yml's `tests` job, for the same reason
        # the install step is identical there: two gates, one definition.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      - name: Report what this machine actually is
        # The macOS runner is ARM (measured: macOS 26.5.2 arm64, Python
        # 3.13.14), while the engine pins and much of this project's history
        # assume x86_64. That is not a problem to solve here, but it IS a fact
        # every reader of a macOS failure needs in front of them, so the job
        # states it rather than leaving the next person to guess.
        shell: bash
        run: |
          python -c "import platform, sys; print('platform:', platform.platform()); print('machine :', platform.machine()); print('python  :', sys.version)"
          node --version
          echo "DISPLAY=[${DISPLAY:-<unset>}]"

      - name: Install deps
        # Deliberately IDENTICAL to release.yml's `tests` job. The two gates
        # must not drift into two different definitions of "the suite" — if
        # this one installs a different dependency set, a change can pass here
        # and fail at the tag, which is exactly the late-discovery problem this
        # workflow exists to remove. Change both or neither.
        #
        # Install the project from pyproject (NOT requirements.txt) so the suite
        # runs against the EXACT dependency set the build bundles.
        #
        # MEASURED ON ALL THREE PLATFORMS: this exact sequence succeeds on
        # ubuntu-24.04 (x86_64), windows-latest (AMD64) and macos-latest
        # (arm64). The macOS ARM question was settled by running it, not by
        # assuming the pins would resolve.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary .
          # Surfaces a version conflict (e.g. invisible_playwright's pinned
          # invisible_core drifting from pyproject's == pin) as a clear message
          # rather than as a pile of confusing test failures.
          pip check
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      - name: Provision the browser engine
        # THE FIRST TIME A REAL ENGINE HAS EVER BEEN LAUNCHED BY THIS PROJECT'S
        # AUTOMATION. tests/test_ff_language_override.py carries a fixture that
        # launches a genuine Firefox and sweeps the realm for any function that
        # betrays itself by shape. The assertion was already written and already
        # strong; it had simply never executed anywhere, because the browser
        # BINARY was never provisioned. This step is that provisioning.
        #
        # `pip install .` supplies the playwright PACKAGE (invisible_playwright
        # hard-depends on upstream playwright), so the import guard passes
        # wherever deps are installed — it is the BINARY that was missing, and
        # this is the step that supplies it.
        #
        # NO DISPLAY SERVER IS INSTALLED, AND THAT IS A MEASURED RESULT, NOT AN
        # ASSUMPTION. A headless Firefox was launched on all three runners with
        # DISPLAY deliberately unset and reported a working page on each
        # (Firefox 151 on every platform). Provisioning Xvfb "just in case"
        # would add a moving part that nothing needs; assuming headless works
        # when it does not would fail for a reason unrelated to the product.
        # It was measured: headless suffices, on all three.
        shell: bash
        run: python -m playwright install firefox

      - name: Behavioural checks, no-launch lane (gating)
        # THE INSTRUMENT THIS PROJECT ALREADY OWNED AND NEVER RAN.
        #
        # `src/services/verify/behaviour_cli.py` observes what the product
        # DOES — a proxy assignment surviving unrelated edits, a launch
        # refusing a disproven geography, certificate key material not
        # outliving the session. It worked. Nothing executed it: before this
        # step, `grep -rn behaviour_cli .github/` returned ZERO hits, against a
        # same-shape positive control that returns three files for
        # `engine_gate`. So the probe discriminates and the zero was real.
        #
        # WHY THAT MATTERED, MEASURED RATHER THAN ASSERTED: planting
        # `raise AssertionError("MUT")` at the head of each `_run_*` body
        # leaves `tests/test_behaviour_checks.py` at 38 passed for SIX of the
        # seven bodies. Only `_run_launch_refuses_broken_geography` is killed
        # (4 failed, 34 passed) — the covered-body control that makes the six
        # greens interpretable rather than a broken experiment. That file tests
        # the RULES deciding whether a verdict may be published, deliberately
        # never the checks, and nothing else covered them either. The bodies
        # could rot silently while the suite stayed green; this step is the
        # venue where that stops being invisible.
        #
        # ⚠️ PLACED BEFORE `Run the test suite`, DELIBERATELY, AND THAT IS NOT
        # COSMETIC. The step below carries NO `if: always()` and the Windows
        # leg is RED AT ITS MEASURED FLOOR (see the floor table there: ubuntu
        # 0+1, macos 0+1, windows 22+1). A behavioural step appended AFTER it
        # would therefore be silently skipped on 1 of 3 platforms forever —
        # which is this step's own defect, a gate that never executes,
        # re-created one level up. Running FIRST is preferred over `if:
        # always()` because this lane costs ~0.8s and is a genuine gate: it
        # should be able to fail the job on its own terms, not merely leave a
        # reading behind like the GPU step does.
        #
        # IT MUST STAY AFTER `Install deps`. The lane is NOT dependency-free —
        # an import census after `run_checks(None, skip_launch=True)` shows it
        # loads `cryptography` (a first-class dep, pyproject.toml). Run without
        # the project installed it does not fail cleanly, it DEGRADES: two of
        # the three checks report CANNOT RUN with ModuleNotFoundError and the
        # command exits 2. That is why this is here and not in the cheaper
        # `types` job, which installs requirements-dev.txt only and never
        # installs the project — a step there would be permanently red saying
        # "nothing was measured", which is precisely the failure this step
        # exists to remove.
        #
        # THE EXIT CODE GATES THE JOB, AND ALL THREE CODES STAY DISTINCT:
        # 0 held, 1 a FINDING about the product, 2 nothing was measured. Exit 2
        # fails the job on purpose — "could not look" is not a pass, and a
        # permanently-green check that quietly stopped looking is the whole
        # thing this instrument was built to catch. The script owns that
        # mapping and explains it; do not collapse it to "non-zero" here.
        #
        # NOT the launch lane: `--skip-launch` runs the three checks needing no
        # browser, no display and no exit. The four launch-backed checks and
        # any display provisioning are separate work.
        shell: bash
        run: python .github/scripts/run_behaviour_checks.py

      - name: Run the test suite
        # THE ENVIRONMENT DECLARES WHAT IT SUPPLIES — IT IS NEVER INFERRED.
        #
        # This job has just provisioned a browser, so it SAYS SO, and from that
        # moment a browser probe that declines to run is a FAILURE naming what
        # was missing rather than a skip nobody reads. That is PS-58's
        # mechanism (conftest.py), consumed here rather than re-invented; this
        # workflow deliberately introduces no second vocabulary for "did not
        # run".
        #
        # The declaration is an explicit environment variable BECAUSE the
        # tempting shortcut — "playwright imported, therefore this machine
        # supports browser tests" — re-creates the original defect one level
        # up: it concludes "unsupported here" on precisely the machine where
        # support broke, which is the one case that must be loud. Nothing reads
        # the presence of the thing being checked.
        #
        # ---------------------------------------------------------------------
        # WHAT THIS JOB PROVISIONS, AND WHAT IT DOES NOT — STATED, NOT IMPLIED
        # ---------------------------------------------------------------------
        # `browser` is an UMBRELLA capability, and it covers ONE engine:
        #
        #   PROVISIONED HERE : browser_firefox — the step above runs
        #     `python -m playwright install firefox` (:152), which is the only
        #     `playwright install` line in this file. Declaring `browser`
        #     expands to it, so a Firefox probe that declines to run on this
        #     job is a FAILURE. That is the whole of what the declaration buys.
        #
        #   NOT PROVISIONED ANYWHERE : browser_chromium — and this is the
        #     honest half. Measured at this commit, not assumed:
        #       * src/services/profile/coherence.py:78 -> DEFAULT_ENGINE =
        #         "chromium". It is also the engine every impossible
        #         os_type/engine pair is reconciled TOWARD (:99, :162). THE
        #         ENGINE THE PRODUCT DEFAULTS TO IS THE ONE NO GATE LAUNCHES.
        #       * src/services/browser/process.py returns early for firefox
        #         (:353-356) BEFORE all 13 `extensions.append` calls
        #         (`grep -c "extensions.append" src/services/browser/process.py`
        #         -> 13): audio, WebGL, GPU, device, voice, locale, mobile,
        #         native-cloak, stealth, canvas-ctx, measuretext, search, geo.
        #         None of the 13 is exercised by any gate on any platform.
        #
        # WHY CHROMIUM IS NOT SIMPLY ADDED TO THE UMBRELLA. Folding it in would
        # turn this job red for want of PROVISIONING rather than for want of
        # correctness — a gate that fails for the wrong reason teaches its
        # reader to ignore it. So the gap is NAMED instead: `browser_chromium`
        # is a real capability nothing declares, and every declared run PRINTS
        # what the declaration does not cover, next to the green line it
        # qualifies. "ok browser" can no longer be misread as "both engines".
        #
        # CLOSING IT IS A SEPARATE SLICE, AND IT IS NOT ONE LINE. It is NOT
        # `python -m playwright install chromium`: the product launches
        # fingerprint-chromium, not playwright's chromium build. That binary
        # arrives through the `download_engine` route
        # .github/workflows/engine-autoupdate.yml:104-115 uses against a pinned
        # baseline tag — so which build, which pin and which runner are all open
        # questions. Naming them here is not the same as promising them.
        #
        # (engine-autoupdate.yml's own gate stays firefox-only for a recorded
        # reason — :80-87, one host and one job, so host variance is not read as
        # engine drift — and is correctly fail-closed at :230.)
        #
        # ---------------------------------------------------------------------
        # THE FAILURE FLOOR, MEASURED PER PLATFORM, WITH ITS PROVENANCE ATTACHED
        # ---------------------------------------------------------------------
        # A floor figure without provenance is the defect this section exists to
        # prevent. An earlier revision reported DEV CONTAINER figures while
        # describing them as measured "on this runner image", and concluded that
        # any red must be the developer's own. The runner disproved that on the
        # very first run. Stale figures were survivable; false provenance was
        # not, because this is the sentence the next reader trusts when deciding
        # whether they broke something. So every figure below names WHERE it was
        # taken.
        #
        #   ON THIS RUNNER (ubuntu-24.04, x86_64, run 32538852334):
        #     0 failed, 2487 passed, 14 skipped, 107s          <- THE LINUX FLOOR
        #
        #   ON THIS RUNNER (macos-latest, arm64, run 32538852334):
        #     0 failed, 2472 passed, 29 skipped, 110s          <- THE MACOS FLOOR
        #     First measurement ever taken of this suite on macOS.
        #
        #   ON THIS RUNNER (windows-latest, AMD64, runs 32538852334/32539306321):
        #     22 failed, 2446 passed, 33 skipped, 225-245s   <- THE WINDOWS FLOOR
        #     First measurement ever taken of this suite on Windows. NOT zero;
        #     see the seven causes below.
        #
        #   ON THIS RUNNER (ubuntu-24.04, BEFORE the Node pin, run 32531702342):
        #     1 failed, 2454 passed, 14 skipped, 107s
        #     Kept as the before/after pair for the Node pin below — the single
        #     failure was NOT caused by the change under test.
        #
        #   IN A DEV CONTAINER (python 3.13 via uv, node pinned to 24 by hand):
        #     bare interpreter, deps NOT installed : 42 failed, 2321 passed
        #     after the install step above         :  0 failed, 2398 passed, 120s
        #     Every one of the 42 was a missing-dependency failure the install
        #     step provides. Useful ONLY as a bare-vs-installed COMPARISON.
        #
        # INHERITED SINCE THOSE FLOORS WERE MEASURED (+1 ON EVERY PLATFORM):
        #     tests/test_verify_engine_gate.py::
        #       test_installed_core_version_answers_empty_when_absent
        #     AssertionError: assert '20.14.0' == ''    <- THE INHERITED RED
        #
        # It arrived on main with PS-50 (4f94721), AFTER the floors above were
        # taken, so today every platform runs at its floor PLUS this one:
        # ubuntu 0+1, macos 0+1, windows 22+1 = 23. The arithmetic is exact and
        # is the reason it can be stated as inherited rather than suspected.
        #
        # IT IS NOT A REGRESSION FROM THIS WORKFLOW, AND THE PROOF IS ON MAIN:
        # main's own tip (fc27868, run 32544633376) fails this same single test
        # with the same message, on a job that predates this matrix. Anything
        # this workflow did would not show up there.
        #
        # THE CAUSE, so nobody re-derives it: installed_core_version() reads
        # importlib.metadata for `invisible_core` and returns "" when absent.
        # The test's own docstring records the assumption it rests on — "is
        # genuinely absent in this container" — and a GitHub runner is not that
        # container: pyproject pins invisible_core==20.14.0, the install step
        # installs it, so metadata resolves and the test gets a version where it
        # demanded emptiness. An environment assumption, not a masking defect.
        #
        # DELIBERATELY NOT FIXED HERE, and not allowlisted either. Repairing an
        # unrelated test to make this job green is the exact move the rest of
        # this section argues against; it belongs to whoever owns PS-50. It is
        # recorded so the next reader can tell an inherited red from their own
        # without re-running anything — which is this whole section's purpose.
        #
        # THE TWO NUMBERS DO NOT MATCH, DELIBERATELY LEFT VISIBLE: the runners
        # collect more tests than the container, and the three runners do not
        # agree with each other either (2487 / 2472 / 2446 collected-and-passed,
        # on platform-gated tests). So no container figure is a stand-in for a
        # runner figure, and no ONE platform's figure is a stand-in for
        # another's. Anyone re-measuring a floor must do it on that platform's
        # runner.
        #
        # THE WINDOWS FLOOR IS NOT ZERO, AND IT IS NOT BEING HIDDEN. Those 22
        # are pre-existing and unrelated to any change gated here — they are the
        # first measurement anyone has ever taken of this suite on Windows, and
        # they are the whole reason this matrix exists. They fall into seven
        # causes, none of which is a flake:
        #
        #   os.fork / os.geteuid absent on Windows (4)
        #     test_browser_env_policy.py x3, test_cert_terminator.py x1
        #   file mode asserted 0o600 but read back 0o666 (2)
        #     test_trash_store.py, test_trash_stores.py  <-- SEE BELOW
        #   an unwritable path does not raise OSError on Windows (2)
        #     test_verify_snapshot.py
        #   cp1252 default encoding on file reads (3)
        #     test_locale_ext.py — UnicodeDecodeError: 'charmap' codec
        #   a socket is opened where the POSIX path opens none (3)
        #     test_rotate_through_proxy.py x2, test_proxy_checker_lanes.py x1
        #   engine install/restore sentinel behaviour differs (4)
        #     test_engine_ensure.py
        #   path/text comparison differences (4)
        #     test_title_ext.py x2, test_verify_baseline.py, test_rotate_* x1
        #
        # AT LEAST TWO OF THOSE ARE SECURITY-RELEVANT RATHER THAN COSMETIC and
        # are reported, not repaired, here: the trash-store files that must be
        # owner-only are world-readable (0o666) on Windows, and a proxy lane
        # that must refuse to open a socket opens one. Both are exactly the
        # "holds on Linux, does not hold on Windows" finding this matrix was
        # built to surface. Fixing them is NOT this workflow's job and was
        # explicitly out of scope for the ticket that added it; they belong to
        # the product, and the honest move is to make them visible on every PR
        # until someone owns them.
        #
        # NO ALLOWLIST IS CONFIGURED, ON ANY PLATFORM, AND THAT IS DELIBERATE.
        # A list of "known" failures is precisely how a real regression gets
        # waved through, and it is also how a floor becomes permanent: the 22
        # would stop being a debt anyone can see and start being scenery. The
        # Windows job is therefore RED at its measured floor, on purpose, and
        # will stay red until the product is fixed — which is a statement about
        # persona on Windows, not about this gate. Do not silence it, do not
        # mark the platform continue-on-error (that would hide NEW Windows
        # regressions too, which is the allowlist defect at job scale), and do
        # not "fix" unrelated tests to improve the number.
        #
        # WHY THE NODE PIN ABOVE EXISTS. Node 21+ defines `navigator` as a
        # getter-only accessor, so a sloppy-mode assignment over it is a SILENT
        # no-op. tests/test_ff_language_override.py's harness installed its stub
        # that way; on the runner's Node the stub was never installed and the
        # test read the host's real locale, while a Node 20 machine stayed
        # green. Nothing in this repo pinned Node, so the gate could change its
        # answer with no change to the repo. Fixed at source (defineProperty)
        # and pinned here — this gate found a real, live bug on its first run.
        #
        # Reported, not laundered: tests that stand up real sockets/TLS with
        # timeouts (tests/test_cert_manager.py::test_session_end_to_end and
        # tests/test_cert_terminator.py::test_terminator_presents_cert_to_admin_host)
        # were seen failing intermittently under full-suite load in an earlier
        # session, and were reproduced failing on an unmodified main as a
        # control, so they are pre-existing and unrelated to any change gated
        # here. They are NOT allowlisted and NOT fixed. If one trips a PR,
        # re-run it and file it — do not add it to a skip list.
        #
        # A THIRD MEMBER OF THAT FAMILY HAS NOW BEEN OBSERVED, and it is
        # recorded here rather than absorbed silently:
        #   tests/test_cert_terminator.py::
        #     test_terminator_does_not_present_cert_to_other_host
        #     Failed: DID NOT RAISE SSLError
        # Windows came back 24 on run 32547960917 where the arithmetic above
        # predicts 23 (floor 22 + the inherited red). The delta is exactly this
        # one test, and it did NOT fail on the immediately preceding run of the
        # same branch (32546241928, 23 failed) — so it is intermittent, not a
        # new floor. It stands up a real mTLS origin over loopback with an 8s
        # timeout via the same _mtls_origin helper as the sibling named above,
        # which is why it belongs to this family and not to the seven causes.
        # NOT allowlisted, NOT skipped, and the floor figure above is NOT being
        # revised upward to absorb it — a floor that quietly grows to match
        # whatever the last run produced is not a measurement.
        shell: bash
        env:
          # ⚠️ THE ubuntu-24.04 CONDITION IS LOAD-BEARING, NOT A TIDINESS.
          # `/usr/bin/chromium` exists ONLY on the ubuntu runner, so the 15
          # ui_driver tests legitimately SKIP on macOS and Windows. Declaring
          # `ui_driver` on those platforms would convert an honest, expected
          # skip into a red job — a gate failing for a reason that is true of
          # the runner rather than of the code. So the shard's declaration is
          # applied where the tier actually executes, and every other job keeps
          # the `browser` declaration it had before this split.
          PERSONA_REQUIRED_CAPABILITIES: ${{ matrix.os == 'ubuntu-24.04' && matrix.shard.capabilities || 'browser' }}
        # `-m` here SELECTS THIS SHARD'S PORTION — it is not the `-k` narrowing
        # forbidden above. The two shards partition the suite (15 + 5551 ==
        # 5566, pinned by tests/test_ci_shard_partition.py) and both gate, so
        # the union of what runs is unchanged.
        run: python -m pytest -q -m "${{ matrix.shard.marker }}"

      - name: GPU reading (known-environmental, never a pass)
        # A hosted runner has no GPU, so WebGL renders in software. A persona
        # profile that declares a discrete GPU over a software-rendered canvas
        # is an IMPOSSIBLE PAIR — and the masking charter classifies that as a
        # HOST-FACT LEAK (the deployment environment reaching through the mask),
        # not as a configuration mistake. On this infrastructure that pair is
        # present BY CONSTRUCTION, on every run, permanently.
        #
        # It is therefore TAGGED, not fixed and not hidden: recorded with its
        # reason, never counted as a pass (the script asserts nothing and always
        # exits 0), and never raised as a new defect. `if: always()` so it
        # cannot vanish from the record just because the suite above went red —
        # the Windows job is red at its floor, and this reading must survive it.
        #
        # Nothing here installs a driver or forces a renderer string. Doing so
        # would corrupt the one reading this environment genuinely cannot give.
        if: always()
        shell: bash
        run: python .github/scripts/report_runner_gpu.py
