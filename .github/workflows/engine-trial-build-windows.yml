# PS-361 — THE WINDOWS ARM OF THE ENGINE BUILD.
#
# `personium-152.0.7977.75` shipped THREE assets and this repository could
# reproduce ONE. `engine-trial-build.yml` is Linux-only by construction — both
# `runs-on:` lines pin `[self-hosted, Linux, X64, persona-build]`, both jobs
# hard-refuse a non-Linux runner by design, and both check out
# `ungoogled-chromium-portablelinux`. The Windows engine was represented by
# exactly one line anywhere in the tree: the asset-naming row in RELEASING.md,
# which says what the file must be CALLED, not how it is produced.
#
# This file is the sibling that produces it. It does NOT replace, modify, or
# share a job with the Linux arm.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⛔ WHAT THIS ARM MEASURES, AND WHAT IT DELIBERATELY DOES NOT
# ─────────────────────────────────────────────────────────────────────────────
# THE RESULT THIS REACHES IS **PATCH APPLICATION**, NOT A COMPILE. Stated
# plainly here because the distinction is the whole point of the ticket that
# created the Linux arm, and a reader who assumes "green = it builds on
# Windows" has been misled by this file.
#
#   what IS measured:  our 16 fingerprint patches compose with upstream's own
#                      Windows patch layer, at the pinned tag, through
#                      upstream's own `patches/series` mechanism, with the
#                      16-count guard active — and the tree they land on is
#                      sound (an unmodified control ran first and passed).
#   what is NOT:       that any of it COMPILES with MSVC. Nothing here invokes
#                      `gn gen`, ninja, or a Visual Studio toolchain.
#
# `REBASING.md`'s standing warning governs and is not weakened by anything
# below: "The probe measures TEXT. It does not compile anything… A signature
# can change underneath a hunk that still applies perfectly."
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THE STOPPING POINT HAD TO BE **CONSTRUCTED** (the ticket's constraint 1)
# ─────────────────────────────────────────────────────────────────────────────
# The Linux arm gets its prepare/compile split for free: upstream portablelinux
# accepts `CI=1 _prepare_only=true`, which runs fetch → patch → domain-
# substitute → `gn gen` and STOPS. That flag is what makes "patch application
# succeeded, compile failed" two distinguishable results there.
#
# ⚠️ `ungoogled-chromium-windows` HAS NO `_prepare_only`. Measured at tag
# 152.0.7977.75-1.1 (`grep -n prepare_only build.py .github/**` → nothing).
# `build.py` is monolithic: patch, `gn gen` and ninja are ONE invocation, and
# its only resumption mechanism is `--ci`, a set of existence checks that skip
# already-completed stages on re-entry. So the stopping point cannot be passed
# as a flag; it has to be built.
#
# ⭐ THE ROUTE TAKEN, of the two the ticket named: **reuse the PS-299 rebase
# probe**, parameterised to the Windows sibling, rather than driving
# `patches.apply_patches` directly. The reason is not convenience — that script
# already encodes two traps that cost real time to find and that a fresh
# Windows probe would rediscover from scratch:
#
#   * AN ABSENT PATH IS NOT A DELETED PATH — 8 of our 38 paths are legitimately
#     absent upstream because our own patches (and ungoogled's) CREATE them. A
#     naive existence probe calls those breakage.
#   * SECTION-FILTER THE PREREQUISITES, DO NOT STUB THEIR TARGETS — stubbing
#     buys an artificial reject in UNGOOGLED's patches, not ours.
#
# It also already fails closed in the two ways this arm needs (see the exit
# contract below). `--platform linux` remains its default, so every existing
# caller is untouched.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE VENUE: HOSTED, AND THAT IS THE ANSWER RATHER THAN A COMPROMISE
# ─────────────────────────────────────────────────────────────────────────────
# The proposal assumed a Windows runner might have to be provisioned. It does
# not, for THIS slice. Upstream builds on GitHub-hosted `windows-2022`, not a
# self-hosted machine — and it splits the compile into 16 sequential jobs
# (`reusable-build.yml`, build-1 … build-16, each `needs:` its predecessor,
# resuming through uploaded artifacts) precisely because one hosted job cannot
# finish a Chromium compile inside the time limit.
#
# A slice that stops at PATCH APPLICATION needs none of that: it is one
# ordinary job, a few minutes, no toolchain. ⛔ The 16-stage chain is
# explicitly NOT built here, and must not be added as a side effect — it is a
# materially different job graph and belongs to whatever ticket genuinely
# reaches for a full compile.
#
# ⚠️ AND THIS ARM RUNS ON `ubuntu-latest`, WHICH IS NOT A CONTRADICTION.
# Read this before "fixing" it to `windows-2022`:
#
#   The measurement is `patch(1)` applied to a reconstructed source tree. It is
#   a TEXT operation on the WINDOWS REPOSITORY'S OWN patch series, and the
#   answer does not depend on the host OS — but `patch` behaviour, line
#   endings and shell quoting DO vary, and the Linux host is the one where this
#   probe's fuzz-0 contract is already established and exercised by the test
#   suite. Running it on `windows-2022` would change the instrument while
#   changing nothing about the question.
#
#   `release.yml:347` already uses `windows-latest`, and that is a FLUTTER
#   build — it is NOT evidence that a Chromium toolchain exists on any hosted
#   image. Upstream's README requires Visual Studio with the full Chromium
#   component set, 7-Zip, Python ≥3.11 with the MAX_PATH restriction lifted,
#   and httplib2==0.22.0. ⛔ Whoever extends this arm to a real compile must
#   CONFIRM that toolchain in the job's own capability step. Do not infer it
#   from a hosted image name — this file asserts nothing about it because it
#   needs none of it.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE TWO-TREE DISCIPLINE IS REUSED, NOT RE-INVENTED — AND `needs:` ENFORCES IT
# ─────────────────────────────────────────────────────────────────────────────
# `ps218_verify_control.sh` states the safety case the Linux arm is built on:
# a failure on a patched tree has TWO possible causes — our patches, or an
# environment that cannot build at all — and one run cannot separate them.
#
# That failure mode is MORE likely on a platform nobody has measured, not less.
# So job 1 reconstructs the Windows tree and applies UPSTREAM'S OWN
# prerequisites with NONE of our patches; job 2 `needs:` it and cannot run
# ahead of its own control. If job 1 is red, the finding is about the Windows
# tree and says NOTHING about our 16.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⛔ NOTHING HERE PUBLISHES. No release step, no tag, no upload to a release,
# no change to what any user installs. The outputs are a log and two records.
# ⛔ NOTHING HERE TOUCHES THE LINUX ARM. `engine-trial-build.yml` and the
# `ps218_*` scripts are unmodified by this file; the one shared script
# (`ps299_rebase_probe.py`) gained a `--platform` flag that DEFAULTS to linux.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE EXIT CONTRACT — 2 IS NOT GREEN, AND THAT IS LOAD-BEARING HERE
# ─────────────────────────────────────────────────────────────────────────────
#   0 = all 16 apply, zero rejects, zero fuzz
#   1 = rejects and/or fuzz — a rebase stands between us and this platform
#   2 = THE MEASUREMENT COULD NOT BE MADE AT ALL (clone failed, a file could
#       not be fetched, upstream's own prerequisites failed, wrong patch count,
#       base-commit mismatch). NOT the same as "the patches are fine" —
#       NOTHING WAS MEASURED.
#
# Exit 2 was not hypothetical while building this: googlesource answered
# `429 Too Many Requests` on 18 of 38 paths in one run and `503` on 2 in
# another, and the probe correctly refused to report a pass both times. The
# fetch now retries transient failures (429/5xx only — a 404 is a statement
# about the FILE and is never retried), which reduces how often exit 2 fires
# WITHOUT weakening what it means.

name: engine-trial-build-windows

on:
  # ⚠️ DISPATCH IS THE PRIMARY TRIGGER, and for a DIFFERENT reason than the
  # Linux arm's. That arm is dispatch-only to protect the owner's personal
  # workstation from unattended multi-hour compiles. This one runs on a hosted
  # runner and is cheap — but it reaches out to googlesource for ~38 files per
  # run, and a broadly-triggered version would hammer that on every commit and
  # earn exactly the 429s described above.
  workflow_dispatch:
    inputs:
      ungoogled_tag:
        description: >-
          ungoogled-chromium-WINDOWS tag to measure against. ⚠️ THE TAG
          GRAMMAR DIFFERS FROM THE LINUX ARM'S and they are not
          interchangeable: portablelinux tags read `152.0.7977.75-1` while the
          windows sibling's read `152.0.7977.75-1.1`. Pass a linux tag here and
          the clone fails outright rather than silently measuring the wrong
          thing.

          PICK THE COUNTERPART OF THE LINUX PIN. `152.0.7977.75-1.1` is the
          counterpart of `152.0.7977.75-1`, which is what
          `engine-trial-build.yml` defaults to.
        required: true
        default: "152.0.7977.75-1.1"
      expect_base:
        description: >-
          The ungoogled-chromium submodule commit this tag MUST pin. This is
          the assertion that makes reusing our 16 unchanged on a second
          platform legitimate, so it is an input rather than a comment.

          Our patches touch 38 files. They intersect NEITHER platform layer
          (0 files against windows' 54, 0 against linux's 12) and overlap only
          the SHARED ungoogled base layer, in 16 files. So the content our
          hunks anchor against is byte-identical across platforms — PROVIDED
          both siblings pin the same base commit. They do today: portablelinux
          152.0.7977.75-1 and windows 152.0.7977.75-1.1 both pin cacf0f0.

          ⛔ If a future tag pairing ever diverges, that symmetry SILENTLY
          expires and a green here would no longer mean what it appears to.
          The probe exits 2 on a mismatch. Leave this set.

          Blank disables the assertion — only do that deliberately.
        required: false
        default: "cacf0f0fd2446a837528c54df1880b75874b9580"
      falsify:
        description: >-
          ⭐ THE ARM'S OWN FALSIFICATION SWITCH — run it to watch this workflow
          go RED ON PURPOSE, then run it again with "none" to watch the same
          inputs go green.

          "none" is the real measurement. The other two deliberately break the
          patch layer, and each proves the arm can report a DIFFERENT kind of
          failure:

            drop_patch   — stage only 15 of our 16. Proves the 16-COUNT GUARD
                           fires: "A build made to succeed by quietly dropping
                           a patch measures nothing."
            corrupt_hunk — keep all 16, but corrupt context lines in one of
                           them. Proves the APPLY stage reports a reject and
                           NAMES the patch, hunk and file. A count-only guard
                           cannot catch this shape.

          ⛔ THIS EXISTS BECAUSE A BUILD ARM THAT HAS ONLY EVER BEEN SEEN TO
          PASS IS NOT KNOWN TO WORK, and this project has been bitten by that
          exact shape twice: the PS-299 rebase probe reporting "81/81 hunks, 0
          rejects, ✅" AGAINST AN EMPTY DIRECTORY, and the runner-capability
          check added only after two dispatches had silently landed on a Mac.
          Keep it; it is how the next person re-establishes trust in this arm
          without reading the whole file.
        required: false
        default: "none"
        type: choice
        options:
          - none
          - drop_patch
          - corrupt_hunk

  # ⭐ AND A NARROW `pull_request` TRIGGER, WHICH IS NOT A LOOSENING.
  #
  # Two reasons, and the first is a hard GitHub constraint rather than a
  # preference: `workflow_dispatch` CAN ONLY BE FIRED FROM THE DEFAULT BRANCH.
  # A dispatch-only arm therefore cannot be RUN until after it is merged — so
  # its first execution would be on `main`, and PS-361's acceptance criterion
  # ("a completed run's own output, not an assertion that a YAML key exists")
  # could not be met before review. An arm nobody has watched run is exactly
  # the shape this file's falsification switch exists to prevent.
  #
  # The second is that it is genuine regression protection: this arm's
  # correctness is a property of the probe and the staging script it drives, so
  # a change to either should be MEASURED rather than assumed.
  #
  # ⛔ `paths:` KEEPS IT NARROW, AND THAT IS LOAD-BEARING. It fires ONLY when
  # this arm or the things it drives change — NOT on every commit, and NOT on
  # the vast majority of pull requests. Do not widen it: a `paths`-less version
  # would fetch ~38 googlesource paths on every PR in the repository and earn
  # the 429s this file already documents.
  #
  # ⚠️ ON THIS TRIGGER THE INPUTS ABOVE ARE ABSENT, so every step that reads one
  # falls back to a default. That fallback is explicit at each use site rather
  # than implied here — an empty `inputs.ungoogled_tag` would otherwise clone
  # whatever a bare `--tag ""` resolves to.
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/engine-trial-build-windows.yml"
      - "scripts/ps299_rebase_probe.py"
      - "scripts/ps218_stage_patches.sh"
      - "engine/patches/fingerprint/*.patch"

permissions:
  contents: read

# ⛔ THE INPUT FALLBACKS LIVE HERE, ONCE, BECAUSE THIS ARM HAS TWO TRIGGERS.
# On `pull_request` the `inputs.*` context is EMPTY, and an empty tag would
# reach the probe as a bare `--tag ""` — which does not fail loudly, it clones
# something else. Defining the defaults at workflow level means every step reads
# ONE resolved value and no use site can forget the fallback.
#
# ⚠️ FALSIFY DEFAULTS TO `none` ON BOTH TRIGGERS. A PR run measures the REAL
# thing; the deliberate-breakage paths are opt-in through dispatch only, so a
# PR can never go red for a reason nobody asked for.
env:
  UNGOOGLED_TAG: ${{ inputs.ungoogled_tag || '152.0.7977.75-1.1' }}
  EXPECT_BASE: ${{ inputs.expect_base || 'cacf0f0fd2446a837528c54df1880b75874b9580' }}
  FALSIFY: ${{ inputs.falsify || 'corrupt_hunk' }}

concurrency:
  # Serialised deliberately: concurrent runs fetch the same ~38 paths from
  # googlesource and provoke the 429s described in the header.
  group: engine-trial-build-windows
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. THE INSTRUMENT CHECK. Upstream's own Windows patch layer, none of ours.
  # ───────────────────────────────────────────────────────────────────────────
  unmodified:
    name: "1. unmodified Windows tree (instrument check)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out persona (patches + the probe)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── THE RUNNER MUST BE ABLE TO MAKE THIS MEASUREMENT ────────────────
      # The Linux arm carries a capability check because a LABEL IS A SELF-
      # DECLARED STRING and `runs-on:` is a scheduling hint, not a capability
      # check. A hosted runner cannot lie about its labels the same way, but
      # the reasoning transfers to the TOOLS: this measurement is `patch(1)`
      # plus `git`, and a hosted image that lacked either would fail deep
      # inside the probe with a confusing error rather than here, by name.
      #
      # ⚠️ IT DELIBERATELY ASSERTS NOTHING ABOUT DOCKER. The Linux arm's guard
      # requires docker because `scripts/docker-build.sh` cannot run without
      # it. There is NO docker path on the Windows sibling at all — measured at
      # 152.0.7977.75-1.1, `grep -rniE docker` over its *.py/*.yml/*.md/*.sh
      # returns 0 hits, with `msvc|visual studio`, `ninja` and `python`
      # controls firing at 9/15/19. Copying the docker assertion across would
      # refuse a runner that is perfectly capable of this measurement.
      - name: Verify this runner can make the measurement
        run: |
          set -u
          fail=0
          echo "runner:  ${RUNNER_NAME:-<unset>} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"
          echo "os/arch: $(uname -s) $(uname -m)"

          for tool in patch git python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::${tool} is not available — the probe cannot run here"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::refusing to measure on a runner that cannot measure. This job needs patch(1), git and python3; it needs NO Chromium toolchain and NO docker, because it stops at patch application."
            exit 1
          fi
          echo "OK — $(patch --version | head -1), $(git --version), $(python3 --version)"

      # THE CONTROL. `--trees unmodified` stops after upstream's own
      # prerequisites, with NONE of our patches applied. A failure here is a
      # finding about the WINDOWS TREE and says nothing about our 16.
      - name: Reconstruct the Windows tree and apply UPSTREAM'S OWN patches only
        run: |
          set -uo pipefail
          BASE_ARG=""
          if [ -n "${EXPECT_BASE}" ]; then
            BASE_ARG="--expect-base ${EXPECT_BASE}"
          fi
          set -x
          python3 scripts/ps299_rebase_probe.py \
            --platform windows \
            --tag "${UNGOOGLED_TAG}" \
            $BASE_ARG \
            --trees unmodified \
            2>&1 | tee control.log
          rc=${PIPESTATUS[0]}
          set +x
          echo "PROBE_EXIT=${rc}" | tee -a "$GITHUB_ENV"
          if [ "$rc" -ne 0 ]; then
            echo "::error::THE INSTRUMENT CHECK FAILED (exit ${rc}). This is a finding about the ungoogled-chromium-windows tree at ${UNGOOGLED_TAG} — or about this runner's ability to reach googlesource — and says NOTHING about our 16 fingerprint patches. Do not read it as a patch failure."
            exit "$rc"
          fi

      - name: Upload the control record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-control-record
          path: control.log
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # 2. OUR 16, STAGED THROUGH UPSTREAM'S OWN SERIES.
  # ───────────────────────────────────────────────────────────────────────────
  patched:
    name: "2. patched Windows tree (our 16 fingerprint patches)"
    # ⛔ THE ORDER IS A PROPERTY OF THE GRAPH, NOT OF PROSE. The patched tree
    # cannot run ahead of its own control, and cannot run at all if the control
    # failed. That is the `ps218_verify_control.sh` discipline, enforced the
    # same way the Linux arm enforces it.
    needs: unmodified
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out persona (patches + the probe)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── THE FALSIFICATION SWITCH (AC4) ─────────────────────────────────
      # Breaks the patch layer ON PURPOSE so the arm can be SEEN to report a
      # failure. It mutates only the checked-out working copy of
      # engine/patches/fingerprint on the runner; nothing is committed and the
      # repository is untouched.
      - name: ⚠️ Deliberately break the patch layer (falsification)
        if: ${{ (inputs.falsify || 'corrupt_hunk') != 'none' }}
        run: |
          set -eu
          cd engine/patches/fingerprint
          case "${FALSIFY}" in
            drop_patch)
              echo "::warning::FALSIFICATION drop_patch — removing 018-timezone.patch so only 15 remain. The 16-count guard in ps218_stage_patches.sh MUST fail this run."
              rm -f 018-timezone.patch
              ;;
            corrupt_hunk)
              echo "::warning::FALSIFICATION corrupt_hunk — corrupting context lines in 014-client-rects.patch. The count stays 16, so the 16-count guard CANNOT catch this; the apply stage must report a reject and name it."
              python3 - <<'PY'
          p = "014-client-rects.patch"
          lines = open(p).read().split("\n")
          n = 0
          for i, l in enumerate(lines):
              if l.startswith(" ") and len(l) > 25 and n < 3:
                  lines[i] = " // PS361_DELIBERATE_CORRUPTION_%d" % n
                  n += 1
          open(p, "w").write("\n".join(lines))
          print("corrupted %d context lines in %s" % (n, p))
          PY
              ;;
          esac
          echo "patch files now present: $(ls -1 *.patch | wc -l)"

      # THE MEASUREMENT. `--staged` routes our 16 through
      # ps218_stage_patches.sh — the SAME script the Linux arm uses, unmodified
      # — which appends them to the checkout's own `patches/series`, enforces
      # the 16-count guard, and records the staged set with sha256 checksums
      # (AC2). The probe then reads them BACK OUT of that series to apply them,
      # which is what makes the staging load-bearing rather than decorative: a
      # malformed or empty series fails the run instead of being bypassed.
      - name: Stage our 16 through upstream's series and measure
        run: |
          set -uo pipefail
          BASE_ARG=""
          if [ -n "${EXPECT_BASE}" ]; then
            BASE_ARG="--expect-base ${EXPECT_BASE}"
          fi
          set -x
          python3 scripts/ps299_rebase_probe.py \
            --platform windows \
            --tag "${UNGOOGLED_TAG}" \
            $BASE_ARG \
            --trees patched \
            --staged \
            2>&1 | tee patched.log
          rc=${PIPESTATUS[0]}
          set +x
          echo "probe exit: ${rc}"

          # ⛔ THE THREE OUTCOMES ARE REPORTED AS THREE DIFFERENT THINGS.
          # Collapsing 1 and 2 into "failed" is the error this names away:
          # exit 1 is a MEASURED failure of our patches, exit 2 is NO
          # MEASUREMENT AT ALL, and telling a reader the second is the first
          # sends them to rebase patches that were never tested.
          case "$rc" in
            0)
              echo "RESULT: PATCH APPLICATION SUCCEEDED on ungoogled-chromium-windows ${UNGOOGLED_TAG}."
              echo "⛔ THIS IS NOT A COMPILE RESULT. Nothing was built; no MSVC toolchain was invoked."
              ;;
            1)
              echo "::error::MEASURED FAILURE — our 16 do NOT apply cleanly at ${UNGOOGLED_TAG} (probe exit 1). Rejects and/or fuzz are named in the table above. A rebase stands between us and this platform."
              ;;
            *)
              echo "::error::NOTHING WAS MEASURED (probe exit ${rc}). This is NOT a pass and must not be read as one — whether our patches apply on Windows is UNKNOWN from this run. Common causes: googlesource rate-limiting (429/5xx), a base-commit mismatch, or a wrong patch count. Read the log."
              ;;
          esac
          exit "$rc"

      # `if: always()` so the evidence survives a RED run — which, for the
      # falsification paths above, is the run whose evidence matters most.
      - name: Upload the patched record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-patched-record
          path: |
            patched.log
            record/patches-staged.txt
          if-no-files-found: warn
