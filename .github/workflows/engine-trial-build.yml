# PS-218 — TRIAL BUILD OF OUR OWN ENGINE, ON THE OWNER'S SELF-HOSTED RUNNER.
#
# This workflow exists to produce ONE number that no existing measurement has:
# whether ungoogled-chromium plus our 16 fingerprint patches COMPILES. Every
# figure the investigation (5c087078) produced measures whether a patch applies
# as TEXT. A patch that lands with nothing worse than line-offset drift can
# still break the build when a function it calls changed signature, and that is
# historically where rebase work actually goes.
#
# NOTHING HERE SHIPS. The output is a report, a binary that exists to be
# examined, and — if the compiles succeed — one patch. No release, no change to
# what users install, no switch of substrate.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE IS SEPARATE FROM ci.yml, AND MUST STAY SEPARATE
# ─────────────────────────────────────────────────────────────────────────────
# `ci.yml` gates every other ticket in this repo. It runs on hosted runners.
# This workflow runs on the OWNER'S PERSONAL WORKSTATION. If that machine is
# asleep, rebooted, or simply off, a job targeting it queues forever — and a
# queued job that never starts is indistinguishable from one that was never
# triggered. Folding this into ci.yml would mean the owner closing his laptop
# could block every merge in the project. It is a separate file so that an
# offline runner costs a pause here and nothing anywhere else.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ workflow_dispatch ONLY. THIS IS THE CONSTRAINT THAT PROTECTS HIS MACHINE.
# ─────────────────────────────────────────────────────────────────────────────
# A self-hosted runner picks up ANY workflow whose labels it matches. A build
# triggered on push would start a multi-hour Chromium compile on his personal
# workstation on every commit, pegging 32 cores for hours at a time, repeatedly,
# with nobody asking. There is deliberately no `push:` and no `pull_request:`
# trigger below, and none may be added. If a branch trigger is ever wanted it
# must name ONE branch and must never be `main` or pull requests.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE RUNNER SELECTOR IS `[self-hosted, Linux, X64, persona-build]` — ALL FOUR.
# ─────────────────────────────────────────────────────────────────────────────
# An earlier comment on PS-218 recommended `persona-build-linux`; the owner
# registered under `persona-build` and a later comment corrected it. The
# correction is authoritative and is what is written below. Using the wrong
# label would queue against a label no runner carries and wait forever WITH NO
# ERROR — for a long time the single most confusing failure mode available
# here.
#
# Registered runner: `persona-wsl-builder` on amnesiadevelopment/persona,
# labels `self-hosted, Linux, X64, persona-build`, WSL2 Ubuntu 26.04,
# 32 threads / 54 GB RAM / 16 GB swap, Docker 29.7.2.
#
# ⚠️ A LABEL DOES NOT IDENTIFY A MACHINE, AND ON 2026-09-04 A SECOND ONE
#    ANSWERED THIS ONE. That is a NEW and WORSE failure mode than the queue-
#    forever one above, because it does not hang: it fails in about twenty
#    seconds with an error that reads like a build problem, on a machine that
#    cannot build Chromium at all.
#
#    `persona-mac-builder` — Darwin arm64 (T8112), 8 cores, NO DOCKER — was
#    registered carrying `persona-build`, and a dispatch went to whichever
#    runner picked it up first. Two runs landed on it, measured, not inferred
#    (`gh api .../actions/runs/<id>/jobs --jq '.jobs[].runner_name'`):
#
#      33920732173  trees=patched  → persona-mac-builder; the PS-244 borrowed-
#                                    control guard REFUSED it correctly, naming
#                                    the host mismatch and the 32-vs-8 nproc gap
#      33920892080  trees=both     → persona-mac-builder; died at the instrument
#                                    check with
#                                    `./scripts/docker-build.sh: line 9:
#                                     docker: command not found`
#
#    (Both guards behaved correctly — the workflow never compared a patched tree
#    against a control it could not trust. What was broken was the SCHEDULING.)
#
#    GitHub gives every self-hosted runner automatic OS/arch labels alongside
#    its custom ones, so the repo can exclude the wrong machine WITHOUT anyone
#    touching a runner registration: requiring `Linux` and `X64` matches the WSL
#    builder and CANNOT match an arm64 Mac. That is why both `runs-on:` lines
#    below name four labels and not two. Do not "simplify" them back to
#    `[self-hosted, persona-build]` — that is the bug, and
#    `tests/test_ps218_trial_build_workflow.py` asserts against it.
#
#    Installing docker on the Mac is NOT the fix: it is arm64, so it would
#    produce a binary for the wrong architecture — a green run that ships the
#    wrong thing is worse than a red one.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE ORDER IS THE WHOLE DESIGN — AND IT IS ENFORCED BY `needs:`, NOT BY PROSE
# ─────────────────────────────────────────────────────────────────────────────
# 1. Build the UNMODIFIED tree first. This is the INSTRUMENT CHECK. A compile
#    failure on a patched tree has two possible causes — our patches, or an
#    environment that cannot build Chromium at all — and one run cannot separate
#    them. If the unmodified tree fails, the finding is about the BUILD
#    ENVIRONMENT and says nothing whatsoever about our patches.
#
#    This project has been bitten by exactly this. During PS-192 a reviewer
#    measured the product CLEAN in a container where `psutil` was missing, while
#    `ps` showed three live processes — a green produced by a broken instrument,
#    on the ticket about a defect that hides behind exactly that green.
#
#    `patched` declares `needs: unmodified`, so the patched build CANNOT run
#    ahead of its own control. That ordering is a property of the graph rather
#    than of anyone remembering to honour it.
#
#    PS-244 ADDED A SECOND WAY TO HOLD A CONTROL, AND DID NOT REMOVE THE RULE.
#    A patched build still may not run without one; `trees=patched` changes only
#    WHERE the control comes from — a previously-completed run, named by the
#    operator — so the rebase loop stops paying ~1h25m of unmodified compile per
#    iteration. The borrowed control is VERIFIED, NOT TRUSTED: before anything
#    is built, ps218_verify_control.sh checks that run's OWN RECORDED EVIDENCE
#    for the same ungoogled tag, the same host, and an actual successful compile
#    that left a binary. Any check failing STOPS the build. It never degrades to
#    an unattributed patched build, because that is the error this file exists
#    to prevent. The `needs:` edge remains, and the `if:` below requires the
#    control job to have SUCCEEDED on the `both` path and to have been SKIPPED
#    on the patched-only path — so "ran ahead of a failed control" stays
#    unreachable in the job graph rather than being ruled out in prose.
#
# 2. Build WITH our 16 fingerprint patches, and record what breaks at COMPILE
#    time. Patch application and compilation are SEPARATE RESULTS and are
#    reported separately — see the `prepare` / `compile` step split below, which
#    is what makes that separation structural rather than editorial. Conflating
#    them is the error this ticket exists to correct.
#
# ─────────────────────────────────────────────────────────────────────────────
# PS-307 — THE PREPARED TREE IS REUSED BETWEEN DISPATCHES, AND THAT IS GUARDED
# ─────────────────────────────────────────────────────────────────────────────
# The ucpl checkouts set `clean: false`, so the ~8 GB prepared Chromium tree
# survives between runs instead of being re-downloaded, re-unpacked and
# re-patched every time. On the rebase loop — where a dispatch can die minutes
# in for reasons unrelated to the tree — that preparation was the repeated cost
# the operator asked to stop paying.
#
# IT IS ALSO THE MOST DANGEROUS CHANGE IN THIS FILE, so read this before
# touching it. Upstream's `scripts/shared.sh` skips each preparation phase when
# a stamp file is present INSIDE the source tree, and `apply_patches()` is:
#
#     if [ ! -f "${_src_dir}/.patched.stamp" ]; then
#         patches.py apply "${_src_dir}" "${_main_repo}/patches" "${_root}/patches"
#         touch "${_src_dir}/.patched.stamp"
#     fi
#
# That stamp records THAT patching happened, never WHICH series. Our 16 are
# appended to `patches/series`, which lives OUTSIDE the tree the stamp guards.
# So a preserved, already-stamped tree makes `apply_patches()` a COMPLETE no-op:
# our patches never enter the tree, the compile succeeds, and the artifact is
# labelled as carrying 16 fingerprint patches while carrying none. That is the
# failure the section below forbids in as many words, and it is exactly the
# PS-192 shape — a confident green from an instrument nobody re-zeroed.
#
# Two steps make it safe, and NEITHER MAY BE REMOVED OR MADE `continue-on-error`:
#
#   ps307_tree_state.sh          A tree is reused only when its sealed identity
#                                matches this job's exactly — same ungoogled tag,
#                                same role (unmodified/patched), same fingerprint
#                                patch digest. Anything else is DESTROYED. The
#                                seal is broken before prepare and rewritten only
#                                after it succeeds, so an interrupted run leaves
#                                a tree the next dispatch rebuilds. Same posture
#                                as PS-244's borrowed control: VERIFY, never
#                                trust, and refuse rather than degrade.
#
#   ps307_verify_patches_in_tree.sh  Reads the SOURCE FILES and proves our 16 are
#                                in the tree about to be compiled. It reads NO
#                                stamp and NO series file, deliberately: those are
#                                the artefacts that say "patched" in precisely the
#                                scenario that drops all 16. The patched compile
#                                is GATED on it, and the control job runs the
#                                inverse (`absent`) as the negative control that
#                                makes the positive result mean anything.
#
# `build/download_cache` is a SIBLING of `build/src`, so even a destroyed tree
# keeps the ~1.7 GB tarball. Deleting a tree is cheap; compiling the wrong one
# is not.
#
# 3. Extend the GPU patch to the ServiceWorker realm — only once 1 and 2 have
#    produced a working binary. That step is NOT in this workflow; it is a patch
#    plus a verification harness, and it does not happen if there is no binary.
#
# ─────────────────────────────────────────────────────────────────────────────
# DO NOT TUNE THIS TO MAKE THE BUILD GO GREEN
# ─────────────────────────────────────────────────────────────────────────────
# If our patches do not compile, that IS the answer being paid for. A build made
# to succeed by quietly dropping a patch measures nothing. `continue-on-error`
# is set on the compile steps NOT to hide failure but so that the diagnostics
# and logs are still collected and uploaded when it fails — the failure is then
# reported explicitly in the manifest and re-raised at the end of the job.
#
# A BUILD THAT FAILS IS A SUCCESSFUL OUTCOME FOR THIS TICKET. So is one that
# succeeds. What is unacceptable is a report that cannot distinguish "it
# compiled" from "it was never compiled", or that cannot say which of the two
# trees a failure belongs to. Every artifact below is named for its tree.
#
name: engine-trial-build

on:
  workflow_dispatch:
    inputs:
      ungoogled_tag:
        description: >-
          ungoogled-chromium-portablelinux tag to build. PICK THE NEWEST TAG
          OUR PATCHES APPLY TO — verify with `scripts/ps299_rebase_probe.py
          --tag <tag>`, which measures that in about a minute without a
          checkout or a compile.

          THE OLD SELECTION RULE IS RETIRED, and this note records why so it is
          not reinstated. It read "pick by whether fingerprint-chromium has a
          source tree for it", which pinned us to 144.0.7559.132-1 because
          adryfish/fingerprint-chromium's newest tag (148.0.7778.215) holds
          four files and no source. That rule made sense only while we took the
          patches FROM that upstream. Upstream is DEAD (last commit 2026-06-21)
          and PS-299 rebased the 16 patches onto 152 ourselves, so the
          constraint is now OUR patch set, not their release cadence.

          A TAG WITH NO GITHUB RELEASE IS FINE. `actions/checkout` resolves a
          GIT REF, and the tag list runs ahead of the release feed — on
          2026-09-03 the newest tag was 152.0.7977.75-1 while releases/latest
          was still 152.0.7977.64-1.
        required: true
        default: "152.0.7977.75-1"
      trees:
        description: >-
          Which trees to build. "both" runs the instrument check and then the
          patched tree — the SAFE DEFAULT, and the only one that needs nothing
          from a previous run. "unmodified" runs the instrument check alone —
          use it to establish the environment before spending hours on a
          patched build. "patched" builds ONLY the patched tree and BORROWS its
          control from a previously-completed run named in control_run_id — it
          skips ~1h25m of unmodified compile per iteration, which is the
          dominant cost of the rebase loop (PS-244). A patched build still
          cannot be attributed without a control: the borrowed one is VERIFIED
          (same tag, same host, actually compiled) and the build is REFUSED if
          it is not.
        required: true
        default: "both"
        type: choice
        options:
          - both
          - unmodified
          - patched
      control_run_id:
        description: >-
          REQUIRED WHEN trees=patched, ignored otherwise. The run id of a
          previously-completed dispatch whose UNMODIFIED control this build will
          borrow instead of rebuilding. Take it from the URL of that run
          (.../actions/runs/<THIS NUMBER>). It is CHECKED, not trusted: the run
          must have built the same ungoogled tag on the same host and must
          actually have compiled, established from its own recorded evidence.
          Records are retained for 30 DAYS, so a control older than that is gone
          and the dispatch must fall back to trees=both.
        required: false
        default: ""
      ninja_jobs:
        description: >-
          Ninja parallelism. LEAVE EMPTY for the upstream default (unrestricted,
          = one job per core). ungoogled's FAQ names exhausted memory at LINK
          time as the common build crash and prescribes cutting this before
          adding swap. 54 GB with 16 GB swap should hold. IF YOU SET THIS, THE
          VALUE IS RECORDED IN THE MANIFEST AND STAMPED ON THE ARTIFACT NAME —
          one of this ticket's deliverables is a wall-clock figure tested
          against 130 core-hours ÷ core count (~4–5.5 h here), and an
          UNRECORDED reduction makes that figure wrong in a way no reader can
          detect. That is why this is an input rather than a hidden default.
        required: false
        default: ""

# READ-only, matching the posture ci.yml and release.yml document in place.
# These jobs fetch and execute untrusted third-party code (the Chromium source
# tarball, upstream build scripts, a toolchain downloaded at build time) and
# must not hold a write-capable token that code could exfiltrate.
#
# NO WRITE SCOPE IS GRANTED ANYWHERE IN THIS FILE, and that is the posture to
# preserve. But "read-only" is not one scope: declaring a `permissions:` block
# sets every UNLISTED scope to `none`, so this default alone gives the token
# `actions: none` — and PS-244's borrowed control is an artifact belonging to
# ANOTHER run, which `actions/download-artifact` can only list through
# `GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts`. That endpoint
# needs `actions: read`. The `patched` job therefore widens ITS OWN block by
# that one read scope (see its `permissions:`); this default stays as-is, so
# the control job — which reads no other run — is unaffected.
#
# Do not "simplify" that job-level block away: without it every patched-only
# dispatch 403s at the fetch and the feature cannot work at all.
permissions:
  contents: read

# The owner has ONE machine. Two concurrent Chromium builds on it would contend
# for the very memory that ungoogled's FAQ names as the common crash, and would
# make both wall-clock figures meaningless. Queue rather than cancel: a build
# that has already burned three hours must not be discarded because someone
# pressed the button again.
concurrency:
  group: engine-trial-build
  cancel-in-progress: false

env:
  # The fingerprint-chromium tag our 16 patches were ORIGINALLY vendored from.
  # Recorded here so the manifest can state the exact provenance of the patch
  # set rather than leaving a reader to guess which upstream revision they came
  # from.
  #
  # ⚠️ THIS IS A PROVENANCE STAMP, NOT A BUILD TARGET, and after PS-299 the two
  # no longer coincide. The patches were vendored from fingerprint-chromium
  # 144.0.7559.132 and then REBASED BY US onto Chromium 152 — that upstream is
  # dead (last commit 2026-06-21; its newest tag ships no source tree), so no
  # fingerprint-chromium tag corresponds to what we now build. The value stays
  # at the last real upstream revision because that is the honest answer to
  # "where did these patches come from"; where they currently APPLY is the
  # `ungoogled_tag` input, and `scripts/ps299_rebase_probe.py` is what measures
  # it. Do not "fix" this to match the ungoogled tag — that would assert an
  # upstream revision that does not exist.
  FINGERPRINT_TAG: "144.0.7559.132"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # STEP 1 — THE INSTRUMENT CHECK. Unmodified ungoogled-chromium, nothing of
  # ours anywhere near it. If this fails, the finding is about the environment.
  # ───────────────────────────────────────────────────────────────────────────
  unmodified:
    name: "1. unmodified tree (instrument check)"
    # SKIPPED on a patched-only dispatch — that skip IS the ~1h25m saving, and
    # it is the only thing `trees=patched` actually changes about this job.
    # The patched job below does not treat a skip as permission to run without
    # a control: it requires this job to have SUCCEEDED on the `both` path and
    # to have been SKIPPED on the patched-only path, and on that path a
    # BORROWED control must pass verification before anything is compiled.
    if: inputs.trees != 'patched'
    # Linux + X64 are GitHub's automatic labels for the WSL builder; they are
    # here to exclude `persona-mac-builder`, which also carries `persona-build`
    # and cannot build Chromium (arm64, no docker). See the header.
    runs-on: [self-hosted, Linux, X64, persona-build]
    # Two builds of ~4–5.5 h each are expected; the upstream CI entrypoint
    # itself carries a 5 h ninja timeout. This ceiling is deliberately well
    # above the prediction so that a SLOW build reports a slow wall-clock —
    # which is a finding — instead of being killed and reported as a failure,
    # which would not be.
    timeout-minutes: 900
    outputs:
      compiled: ${{ steps.compile.outputs.compiled }}
    steps:
      # ── THE MACHINE MUST BE ABLE TO BUILD, NOT MERELY CLAIM TO ──────────
      # `runs-on:` above narrows scheduling to a Linux x64 self-hosted runner,
      # which excludes `persona-mac-builder`. But a LABEL IS A SELF-DECLARED
      # STRING supplied at registration — GitHub attaches OS/arch labels by
      # default, and `--no-default-labels` / a hand-written label set can make
      # any machine claim any of them. So `runs-on:` is a SCHEDULING HINT, not
      # a capability check, and it cannot be the only thing standing between a
      # dispatch and a host that cannot build Chromium.
      #
      # This step is that check, and it costs about a second. It runs FIRST so
      # a wrong machine fails HERE, by name, instead of ~20 seconds later
      # inside docker-build.sh with `docker: command not found` — an error that
      # reads like a build problem and sent two reviewers looking for a defect
      # in the tree (runs 33920732173 / 33920892080, PS-299).
      - name: Verify this runner can actually build Chromium
        run: |
          set -u
          fail=0
          echo "runner:  ${RUNNER_NAME:-<unset>}"
          echo "os/arch: $(uname -s) $(uname -m)"

          if [ "$(uname -s)" != "Linux" ]; then
            echo "::error::this runner is $(uname -s), not Linux — the build is a Linux container build and cannot run here"
            fail=1
          fi
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *) echo "::error::this runner is $(uname -m), not x86_64 — it would produce a binary for the WRONG ARCHITECTURE, which is worse than not building"
               fail=1 ;;
          esac
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker is not installed on this runner — scripts/docker-build.sh cannot run, so no tree can be built here"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::refusing to build on a runner that cannot build. This machine answered the \`persona-build\` label but does not meet the requirements above. Fix the runner registration, or narrow \`runs-on:\`; do NOT install docker on a non-x86_64 host to make this pass."
            exit 1
          fi
          echo "OK — Linux x86_64 with docker $(docker --version 2>/dev/null | head -1)"

      # THE CHECKOUT COMES FIRST NOW, and that reordering is required rather
      # than cosmetic: the salvage below is a script that lives in this
      # repository, so it cannot run before this step exists. It is safe —
      # `record/` sits outside both checkout paths, so `actions/checkout`
      # cleans neither it nor the material about to be salvaged from it.
      - name: Check out persona (for the recording scripts)
        uses: actions/checkout@v4
        with:
          path: persona

      # ── PS-289: SALVAGE FIRST, THEN ZERO ────────────────────────────────
      # The zeroing itself is unchanged in effect and is still required for the
      # reason below. What changed is that the previous dispatch's bytes are
      # now CARRIED OUT before being removed instead of being deleted unread.
      #
      # This is the half of PS-289 that makes a dead run readable FROM GITHUB.
      # A runner that dies mid-step never reaches an upload step and GitHub
      # never flushes its job log, so that run's `record/` is stranded on the
      # owner's disk — present, and unreachable. This step copies it into
      # `record/salvaged/`, from where the existing `if: always()` upload ships
      # it as an ordinary artifact of the NEXT dispatch.
      #
      # Salvaged material is quarantined under `salvaged/` and never placed at
      # the top level, because ps218_attribute.sh and ps218_verify_control.sh
      # read exact top-level paths — a salvaged control sitting beside a live
      # one would be the stale-control false attribution the zeroing exists to
      # prevent. Durability must not be bought with that guarantee.
      #
      # ── AND THE ORIGINAL REASON THE ZEROING EXISTS, UNCHANGED ────────────
      # `record/` lives in $GITHUB_WORKSPACE, OUTSIDE both checkouts (persona/
      # and ucpl/), so `actions/checkout` never cleans it and a self-hosted
      # runner does not wipe _work between runs. Left alone, a control log from
      # an EARLIER dispatch — different tag, different day — is still on disk
      # and is therefore *present*, which is the only condition
      # ps218_attribute.sh's "CONTROL UNKNOWN" safety tests. A stale control
      # would be silently treated as this run's and errors billed
      # "PRE-EXISTING — NOT ours" against a tree that was never built here.
      #
      # That is the PS-192 shape this ticket cites: a confident reading from an
      # instrument nobody re-zeroed. The guard fired on absence; staleness needs
      # this.
      - name: Salvage the previous dispatch's evidence, then zero record/
        run: persona/scripts/ps289_journal.sh salvage

      - name: Check out ungoogled-chromium-portablelinux
        uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-portablelinux
          ref: ${{ inputs.ungoogled_tag }}
          # The `ungoogled-chromium` submodule carries utils/, downloads.ini,
          # the 111 de-googling patches and flags.gn. Without it `shared.sh`
          # cannot fetch or patch anything at all.
          submodules: recursive
          path: ucpl
          # ── PS-307: PRESERVE THE PREPARED TREE BETWEEN DISPATCHES ───────────
          # `actions/checkout` defaults to running `git clean -ffdx`, which
          # deletes `build/` — the ~8 GB Chromium tree, its toolchains, and the
          # download cache. That is why every dispatch has been paying the full
          # ~1.7 GB download, unpack, toolchain fetch and 111-patch application
          # from nothing, including on runs that die minutes later for reasons
          # having nothing to do with the tree.
          #
          # `build/` is gitignored upstream and therefore UNTRACKED, so leaving
          # it alone costs the checkout nothing: the tracked files are still
          # reset to the tag by `git checkout --force`, and the per-run repairs
          # (ps306_harden_toolchain.sh, ps218_stage_patches.sh) are re-applied to
          # a freshly-reset `scripts/shared.sh` and `patches/series` exactly as
          # before. Only the untracked build tree survives.
          #
          # It also removes the stall that killed runs 33825514074 and
          # 33828273063: both died inside `git clean -ffdx` on a leftover
          # `build/`. `git clean` no longer runs at all.
          #
          # ⚠️ THIS IS THE UNSAFE HALF OF THE FEATURE ON ITS OWN. A preserved
          # tree keeps upstream's `.patched.stamp`, which makes `apply_patches()`
          # a no-op — and that stamp records only THAT patching happened, never
          # WHICH series. Our 16 go into `patches/series`, which lives OUTSIDE
          # the tree. So `clean: false` unaccompanied would let the patched job
          # compile a tree carrying none of our patches and report it as
          # carrying 16. The two steps below are what make it safe, and neither
          # is optional: `ps307_tree_state.sh` refuses to reuse a tree whose
          # identity is not this job's, and `ps307_verify_patches_in_tree.sh`
          # reads the SOURCE FILES to prove what the tree actually contains.
          clean: false

      # ── PS-307: MAY THE TREE ON DISK BE REUSED? ─────────────────────────────
      # Runs BEFORE prepare, because it may DESTROY the tree — deciding
      # afterwards would be deciding about a tree already used. A tree is reused
      # only when its sealed identity matches this job's exactly: same ungoogled
      # tag, same role (unmodified/patched), same fingerprint patch digest.
      # Anything else is wiped, on the same posture PS-244 established for the
      # borrowed control — an input from a previous run is VERIFIED, not trusted.
      #
      # `build/download_cache` is a SIBLING of `build/src`, so a wipe keeps it
      # and even a cold rebuild skips the ~1.7 GB download.
      #
      # For the control tree the fingerprint digest is `none`; PATCH_DIR is
      # passed anyway so the identity's schema is identical in both jobs.
      - name: Decide whether the prepared tree can be reused
        id: tree
        run: persona/scripts/ps307_tree_state.sh plan unmodified
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          PATCH_DIR: persona/engine/patches/fingerprint

      - name: Record the build environment as the CONTAINER sees it
        id: env
        run: persona/scripts/ps218_record_env.sh unmodified pre-prepare
        env:
          UCPL_DIR: ucpl

      # ── PS-306: THE TOOLCHAIN STEP SEGFAULTS INTERMITTENTLY ─────────────────
      # `tools/rust/update_rust.py` crashes at random under build load on this
      # runner and takes the whole ~12-minute prepare phase with it — three
      # consecutive PS-299 dispatches died there and the compile never ran. In
      # isolation the same script is fine (14/14 clean runs in the same image),
      # and one dispatch did get past it, so the script is not broken: the
      # INVOCATION does not tolerate a transient crash.
      #
      # The call lives in upstream's `scripts/shared.sh`, reached from inside
      # the container by `.github/scripts/build.sh`, so it cannot be wrapped
      # from outside — the repair has to be on disk before `prepare` runs. And
      # `ucpl/` is re-checked-out per dispatch, so it is re-applied per run
      # rather than committed once. It is keyed to the CALL, not to a line
      # number, and refuses to run if the tag's shape is not the one verified.
      #
      # THIS STEP IS IN BOTH JOBS ON PURPOSE. Both run the same prepare phase
      # and both are exposed to the same flake; hardening only one would make
      # the control and the subject non-comparable, which is the single thing
      # this workflow exists to protect.
      #
      # ⚠️ NO `continue-on-error` HERE. This step only rewrites a shell
      # function; if it cannot, the anchor is wrong and the build would proceed
      # with an unverified modification — stop instead.
      - name: Harden the toolchain step against the update_rust.py segfault
        run: persona/scripts/ps306_harden_toolchain.sh unmodified
        env:
          UCPL_DIR: ucpl

      - name: Apply patches (de-googling only) — PATCH APPLICATION, not compile
        id: prepare
        continue-on-error: true
        run: persona/scripts/ps218_build.sh prepare unmodified
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          NINJA_JOBS: ${{ inputs.ninja_jobs }}

      # THE SECOND ENV PASS — the one that can actually read the container.
      # ps218_record_env.sh probes container/cgroup memory only if the image
      # `chromium-builder:trixie-slim` exists, and `prepare` is what builds it.
      # Running the script only BEFORE prepare meant the else-branch was the
      # sole reachable branch on a clean runner: the record claimed three
      # levels (WSL2 guest / container / cgroup) while holding one, and
      # promised a follow-up probe that did not exist anywhere in the
      # workflow. The ticket asks for exactly this reading -- "WSL2's memory
      # allocation is not the host's. Confirm what the build environment
      # actually sees" -- and it is the level that governs the link step.
      #
      # `if: always()` so a failed prepare still records what the machine
      # looked like; the script says plainly when the image is absent rather
      # than reporting a zero.
      - name: Record the build environment AFTER prepare (container level)
        if: always()
        run: persona/scripts/ps218_record_env.sh unmodified post-prepare
        env:
          UCPL_DIR: ucpl

      # ── PS-307: SEAL THE TREE, ONLY AFTER A PREPARE THAT SUCCEEDED ──────────
      # The seal is what lets the NEXT dispatch identify this tree. It is written
      # here and nowhere else, so a run killed inside prepare — the OOM, the
      # segfault, the operator closing the laptop — leaves an UNSEALED tree that
      # the next dispatch rebuilds rather than inherits. That is the ticket's
      # "stale tree left by an interrupted run", made unreusable by construction
      # instead of by anyone noticing.
      - name: Seal the prepared tree so the next dispatch can identify it
        if: steps.prepare.outcome == 'success'
        run: persona/scripts/ps307_tree_state.sh seal unmodified
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          PATCH_DIR: persona/engine/patches/fingerprint

      # ── PS-307: THE NEGATIVE CONTROL, AND THE CONTAMINATION CHECK ───────────
      # Two jobs in one step, and both matter.
      #
      # 1. IT IS WHAT MAKES THE PATCHED JOB'S CHECK MEAN SOMETHING. That job
      #    asserts our 16 patches are PRESENT. A checker with a broken matcher —
      #    a grep whose pattern always hits, an evidence file that came out empty
      #    — would report all 16 found on every tree forever and satisfy that
      #    assertion permanently. Running the INVERSE against a tree known to
      #    carry none of them is what would catch it. "A check that could not
      #    have failed is not coverage" is the standing directive here.
      #
      # 2. IT STANDS ON ITS OWN. If our patches turn up in the CONTROL tree the
      #    control is contaminated, and every "the unmodified tree had this error
      #    too" attribution built on it in ps218_attribute.sh is false. With the
      #    tree now PRESERVED between dispatches, a control that inherited a
      #    patched tree is a newly reachable state rather than a hypothetical.
      #
      # Deliberately NOT `continue-on-error`: a contaminated control cannot
      # attribute anything, so there is nothing worth compiling from it.
      - name: Verify our patches are ABSENT from the control tree
        if: steps.prepare.outcome == 'success'
        run: persona/scripts/ps307_verify_patches_in_tree.sh absent unmodified
        env:
          UCPL_DIR: ucpl
          PATCH_DIR: persona/engine/patches/fingerprint

      # Reached ONLY when the de-googling patches applied. Without this guard a
      # failed `prepare` still ran the compile against a half-patched tree, and
      # `COMPILE_RESULT` arrived as `failure` rather than `skipped` — at which
      # point ps218_manifest.sh's prose says "the compile was never attempted"
      # two rows below a table saying "NO — FAILED". One document, two
      # incompatible claims, and the prose the false one.
      #
      # That is precisely the outcome this ticket names as unacceptable — "a
      # report that cannot distinguish 'it compiled' from 'it was never
      # compiled'" — arriving through the one job whose entire purpose is to be
      # the trustworthy control. The `patched` job has always had this guard;
      # the control is the job that needed it most.
      - name: Compile — THE SEPARATE RESULT
        id: compile
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: persona/scripts/ps218_build.sh compile unmodified
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          NINJA_JOBS: ${{ inputs.ninja_jobs }}

      - name: Write the manifest
        if: always()
        run: persona/scripts/ps218_manifest.sh unmodified
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          NINJA_JOBS: ${{ inputs.ninja_jobs }}
          PREPARE_RESULT: ${{ steps.prepare.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          # PS-307 — a reused tree changes what the prepare wall-clock MEANS, and
          # that figure is one of this workflow's deliverables. A reader must be
          # able to tell a cold prepare from a warm one without opening the log.
          TREE_REUSED: ${{ steps.tree.outputs.reused }}

      # Logs and the manifest are uploaded WHETHER OR NOT the build succeeded.
      # A failed build is a result this ticket is paying for, and a result whose
      # evidence was thrown away is not a result.
      - name: Upload the record (unmodified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps218-unmodified-${{ inputs.ungoogled_tag }}
          path: |
            record/
          if-no-files-found: warn
          retention-days: 30

      # The binary is uploaded separately: it is large, and a reader who only
      # wants to know WHETHER it compiled should not have to download it.
      - name: Upload the binary (unmodified, only if it exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps218-unmodified-binary-${{ inputs.ungoogled_tag }}
          path: |
            ucpl/build/src/out/Default/chrome
            ucpl/build/src/out/Default/chromedriver
          if-no-files-found: ignore
          retention-days: 7

      # Re-raise AFTER the evidence is safely uploaded. `continue-on-error`
      # above collects the diagnostics; this makes the job's verdict honest.
      - name: Re-raise a failure now that the evidence is collected
        if: steps.prepare.outcome == 'failure' || steps.compile.outcome == 'failure'
        run: |
          echo "::error::UNMODIFIED tree did not build (prepare=${{ steps.prepare.outcome }}, compile=${{ steps.compile.outcome }})."
          echo "::error::Per PS-218 this is a finding about the BUILD ENVIRONMENT and says NOTHING about our 16 patches."
          echo "::error::The patched build is intentionally skipped — attributing a patched failure without a working control is exactly the error this ticket exists to correct."
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # STEP 2 — THE SUBJECT. Same tag, same container, same script; the ONLY
  # difference is our 16 patches. `needs: unmodified` is what guarantees the
  # control has already produced its result.
  #
  # THE `if:` BELOW IS A SAFETY GATE, NOT A CONVENIENCE, AND IT IS WRITTEN THE
  # LONG WAY ON PURPOSE. It enumerates the TWO ways this job may legitimately
  # start, and nothing else:
  #
  #   trees=both     → the control job must have SUCCEEDED. Unchanged from
  #                    before PS-244: a failed control still stops the subject.
  #   trees=patched  → the control job must have been SKIPPED, and a BORROWED
  #                    control must then pass verification in the job itself.
  #
  # Naming `success` and `skipped` explicitly — rather than writing something
  # permissive like `always()` or `result != 'failure'` — is what keeps "the
  # patched tree ran after a control that FAILED" unreachable in the job graph.
  # That is the PS-218 invariant, and it survives this change intact.
  #
  # `!cancelled()` is REQUIRED here and is not decoration: GitHub skips a job
  # whose dependency was skipped unless its `if:` contains a status function, so
  # without it the `trees=patched` branch could never run at all. `!cancelled()`
  # is the narrowest one that works — `always()` would additionally run this job
  # after someone cancelled the dispatch, spending hours on a build nobody is
  # waiting for, on the owner's personal workstation.
  # ───────────────────────────────────────────────────────────────────────────
  patched:
    name: "2. patched tree (our 16 fingerprint patches)"
    needs: unmodified
    # WIDENED BY EXACTLY ONE READ SCOPE, and only on this job. The borrowed
    # control is an artifact of ANOTHER run, so `actions/download-artifact`
    # must list that run's artifacts via
    #   GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts
    # which requires `actions: read`. The file-level block above grants
    # `contents: read` only, and a declared block sets every unlisted scope to
    # `none` — so without this the borrow step 403s on EVERY patched-only
    # dispatch, including one naming a perfectly valid control.
    #
    # `contents: read` MUST be repeated here: a job-level block REPLACES the
    # file-level one rather than merging with it, and omitting it would leave
    # the two checkouts unable to read the repo.
    #
    # STILL NO WRITE SCOPE. This job executes untrusted third-party build code,
    # and `actions: read` cannot mutate the repo, publish a release, or move a
    # ref — it can only enumerate and download existing artifacts. The control
    # job is deliberately NOT widened: it reads no other run.
    permissions:
      contents: read
      actions: read
    if: >-
      ${{ !cancelled()
      && ( (inputs.trees == 'both' && needs.unmodified.result == 'success')
        || (inputs.trees == 'patched' && needs.unmodified.result == 'skipped') ) }}
    # Linux + X64 are GitHub's automatic labels for the WSL builder; they are
    # here to exclude `persona-mac-builder`, which also carries `persona-build`
    # and cannot build Chromium (arm64, no docker). See the header.
    runs-on: [self-hosted, Linux, X64, persona-build]
    timeout-minutes: 900
    steps:
      # ── THE MACHINE MUST BE ABLE TO BUILD, NOT MERELY CLAIM TO ──────────
      # `runs-on:` above narrows scheduling to a Linux x64 self-hosted runner,
      # which excludes `persona-mac-builder`. But a LABEL IS A SELF-DECLARED
      # STRING supplied at registration — GitHub attaches OS/arch labels by
      # default, and `--no-default-labels` / a hand-written label set can make
      # any machine claim any of them. So `runs-on:` is a SCHEDULING HINT, not
      # a capability check, and it cannot be the only thing standing between a
      # dispatch and a host that cannot build Chromium.
      #
      # This step is that check, and it costs about a second. It runs FIRST so
      # a wrong machine fails HERE, by name, instead of ~20 seconds later
      # inside docker-build.sh with `docker: command not found` — an error that
      # reads like a build problem and sent two reviewers looking for a defect
      # in the tree (runs 33920732173 / 33920892080, PS-299).
      - name: Verify this runner can actually build Chromium
        run: |
          set -u
          fail=0
          echo "runner:  ${RUNNER_NAME:-<unset>}"
          echo "os/arch: $(uname -s) $(uname -m)"

          if [ "$(uname -s)" != "Linux" ]; then
            echo "::error::this runner is $(uname -s), not Linux — the build is a Linux container build and cannot run here"
            fail=1
          fi
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *) echo "::error::this runner is $(uname -m), not x86_64 — it would produce a binary for the WRONG ARCHITECTURE, which is worse than not building"
               fail=1 ;;
          esac
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker is not installed on this runner — scripts/docker-build.sh cannot run, so no tree can be built here"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::refusing to build on a runner that cannot build. This machine answered the \`persona-build\` label but does not meet the requirements above. Fix the runner registration, or narrow \`runs-on:\`; do NOT install docker on a non-x86_64 host to make this pass."
            exit 1
          fi
          echo "OK — Linux x86_64 with docker $(docker --version 2>/dev/null | head -1)"

      # Checkout first — the salvage script lives in this repository. `record/`
      # is outside both checkout paths, so nothing here disturbs the material
      # about to be salvaged.
      - name: Check out persona (patches + recording scripts)
        uses: actions/checkout@v4
        with:
          path: persona

      # PS-289 salvage + the same zeroing as the control job, for the same
      # reason: `record/` is outside both checkouts, so nothing else cleans it
      # between dispatches. This job additionally READS a control log copied in
      # from the artifact, so a leftover from an earlier run is the exact input
      # that would poison attribution — which is why the salvage quarantines
      # what it recovers under `record/salvaged/` and never at the top level.
      - name: Salvage the previous dispatch's evidence, then zero record/
        run: persona/scripts/ps289_journal.sh salvage

      - name: Check out ungoogled-chromium-portablelinux
        uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-portablelinux
          ref: ${{ inputs.ungoogled_tag }}
          submodules: recursive
          path: ucpl
          # PS-307 — see the long note on the identical key in `unmodified`.
          # `build/` is untracked and gitignored upstream, so skipping
          # `git clean -ffdx` preserves the prepared tree while the tracked files
          # are still reset to the tag. `patches/series` is one of those tracked
          # files, so ps218_stage_patches.sh still appends our 16 to a clean
          # series every run rather than to a growing one.
          clean: false

      # ── PS-307: MAY THE TREE ON DISK BE REUSED? ─────────────────────────────
      # THIS IS THE JOB THE HAZARD LIVES IN, and the ordering below is what
      # contains it.
      #
      # On a `trees=both` dispatch the control job has just sealed an
      # `unmodified` tree in this same preserved workspace. Reusing it here would
      # be catastrophic and SILENT: `.patched.stamp` is present, so upstream's
      # `apply_patches()` skips itself entirely, our 16 never enter the tree, the
      # compile succeeds, and the artifact is labelled as carrying 16 fingerprint
      # patches while carrying none. The identity check refuses it — a tree
      # sealed `unmodified` is not the `patched` tree — and the tree is destroyed
      # and rebuilt. The DOWNLOAD is still reused, which is the bulk of the
      # saving on that path.
      #
      # On the `trees=patched` rebase loop, the case the operator actually asked
      # for, the previous dispatch's patched tree matches on all three fields and
      # the whole prepare collapses to almost nothing.
      #
      # It runs BEFORE staging on purpose: a wipe here must not discard a tree
      # that staging has already been told about, and `plan` reads only the
      # identity file, never `patches/series`.
      - name: Decide whether the prepared tree can be reused
        id: tree
        run: persona/scripts/ps307_tree_state.sh plan patched
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          PATCH_DIR: persona/engine/patches/fingerprint

      - name: Record the build environment as the CONTAINER sees it
        run: persona/scripts/ps218_record_env.sh patched pre-prepare
        env:
          UCPL_DIR: ucpl

      # ── PS-306 — the same repair as the control job, for the same reason ────
      # See the long note on the identical step in `unmodified`. Placed here so
      # both trees enter the prepare phase with the same toolchain invocation:
      # hardening only one of the two would leave the control and the subject
      # running different code, and a comparison between them would measure the
      # difference in the harness rather than the difference in the patches.
      #
      # Sits above the borrow/verify steps only for readability — it touches
      # `ucpl/scripts/shared.sh`, which nothing else in this job goes near, so
      # its position relative to `ps218_stage_patches.sh` is immaterial. What is
      # NOT immaterial is that it is before `ps218_build.sh prepare`.
      - name: Harden the toolchain step against the update_rust.py segfault
        run: persona/scripts/ps306_harden_toolchain.sh patched
        env:
          UCPL_DIR: ucpl

      # ── PS-244: THE BORROWED CONTROL, FETCHED AND VERIFIED BEFORE ANY BUILD ──
      # Placement is load-bearing. These two steps sit ABOVE staging, prepare
      # and compile so that an unusable control costs SECONDS, not the ~1h25m
      # compile this feature exists to avoid. A verification that fired after
      # the build would refuse a result already paid for.
      #
      # They are also below the pre-prepare env record on purpose: that record
      # is THIS run's side of the host comparison, so it must exist before the
      # comparison can be made.
      #
      # `continue-on-error` is deliberately NOT set on either. On the `both`
      # path a missing control is a legitimate state handled by CONTROL UNKNOWN;
      # here it is not — the operator asked to skip the control build, so a
      # control that cannot be fetched and verified means this dispatch cannot
      # produce an attributable result and must stop.
      - name: Fetch the BORROWED control from the run the operator named
        if: inputs.trees == 'patched'
        uses: actions/download-artifact@v4
        with:
          name: ps218-unmodified-${{ inputs.ungoogled_tag }}
          path: control
          # The artifact belongs to ANOTHER run, so it must be named explicitly
          # along with a token that may read it. Without `run-id` this silently
          # resolves against the CURRENT run — which on a patched-only dispatch
          # has no unmodified artifact at all.
          run-id: ${{ inputs.control_run_id }}
          github-token: ${{ github.token }}

      # THE GATE. Everything about whether borrowing is honest happens here:
      # same ungoogled tag (two independent witnesses), same host, and a control
      # that ACTUALLY COMPILED and left a binary — all read from the borrowed
      # run's OWN RECORDED EVIDENCE rather than from the operator's assertion.
      # Any check failing exits non-zero and the job stops here, before a single
      # source file is compiled.
      - name: Verify the borrowed control — REFUSE the build if it is not comparable
        if: inputs.trees == 'patched'
        run: persona/scripts/ps218_verify_control.sh
        env:
          CONTROL_DIR: control
          CURRENT_ENV: record/environment-patched.txt
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          CONTROL_RUN_ID: ${{ inputs.control_run_id }}

      # Our 16 go in through ungoogled's OWN mechanism. `shared.sh`'s
      # apply_patches() already calls
      #   utils/patches.py apply <src> <ungoogled/patches> <root/patches>
      # — it takes MULTIPLE patch directories by design. So our layer is an
      # ADDITION to the existing pipeline rather than a fork of the tooling,
      # which is how fingerprint-chromium composes them today.
      - name: Stage our 16 fingerprint patches into ungoogled's own series
        run: persona/scripts/ps218_stage_patches.sh
        env:
          UCPL_DIR: ucpl
          PATCH_DIR: persona/engine/patches/fingerprint

      # THE FIRST OF THE TWO RESULTS. Whether our patches APPLY as text. This is
      # the quantity every existing figure already measures, captured here so it
      # can be compared against — and distinguished from — the compile below.
      - name: Apply patches (de-googling + OUR 16) — PATCH APPLICATION
        id: prepare
        continue-on-error: true
        run: persona/scripts/ps218_build.sh prepare patched
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          NINJA_JOBS: ${{ inputs.ninja_jobs }}

      # THE SECOND ENV PASS — the one that can actually read the container.
      # ps218_record_env.sh probes container/cgroup memory only if the image
      # `chromium-builder:trixie-slim` exists, and `prepare` is what builds it.
      # Running the script only BEFORE prepare meant the else-branch was the
      # sole reachable branch on a clean runner: the record claimed three
      # levels (WSL2 guest / container / cgroup) while holding one, and
      # promised a follow-up probe that did not exist anywhere in the
      # workflow. The ticket asks for exactly this reading -- "WSL2's memory
      # allocation is not the host's. Confirm what the build environment
      # actually sees" -- and it is the level that governs the link step.
      #
      # `if: always()` so a failed prepare still records what the machine
      # looked like; the script says plainly when the image is absent rather
      # than reporting a zero.
      - name: Record the build environment AFTER prepare (container level)
        if: always()
        run: persona/scripts/ps218_record_env.sh patched post-prepare
        env:
          UCPL_DIR: ucpl

      # ── PS-307: PROVE OUR 16 PATCHES ARE IN THE TREE. THE GATE. ─────────────
      # THE STEP THIS WHOLE TICKET EXISTS FOR, and its placement is the design.
      # It sits between prepare and compile so a tree missing our patches costs
      # SECONDS rather than the ~4–5.5 h compile — and, more importantly, never
      # becomes a binary. A check after the compile would refuse a result already
      # paid for, and would refuse it only after producing the mislabelled
      # artifact it exists to prevent.
      #
      # ⚠️ IT READS THE SOURCE FILES. NOT `.patched.stamp`, NOT `patches/series`,
      # NOT the staging step's exit code. Every one of those says "patched" in
      # precisely the scenario that drops all 16, because the stamp records only
      # THAT patching happened and the series lives outside the tree the stamp
      # guards. The evidence has to come from the tree, so the tree is what is
      # read: each patch's added lines, deleted lines and created files, looked
      # for in the Chromium sources themselves.
      #
      # ⚠️ NO `continue-on-error`. The compile steps carry it deliberately, so a
      # failed compile still yields its diagnostics. This is the opposite: if
      # this fails there is nothing worth compiling, and a build that carried on
      # would produce exactly the artifact the header forbids — "A build made to
      # succeed by quietly dropping a patch measures nothing."
      #
      # The tree-reuse identity check in `ps307_tree_state.sh` already makes the
      # silent-skip sequence unreachable. This step is here because "unreachable
      # by argument" and "verified in the tree" are different claims, and the
      # ticket asks for the second one.
      - name: Verify our 16 fingerprint patches are IN the tree about to compile
        id: verify_patches
        if: steps.prepare.outcome == 'success'
        run: persona/scripts/ps307_verify_patches_in_tree.sh present patched
        env:
          UCPL_DIR: ucpl
          PATCH_DIR: persona/engine/patches/fingerprint

      # ── PS-307: SEAL, ONLY AFTER PREPARE *AND* VERIFICATION BOTH PASSED ─────
      # Stricter than the control job's seal, and deliberately so. This seal is
      # what licenses a FUTURE dispatch to skip patch application entirely, so it
      # may only be written over a tree that has been PROVEN to carry our
      # patches. Sealing on prepare alone would let an unverified tree become the
      # next run's trusted input — the hazard laundered one dispatch forward.
      - name: Seal the prepared tree so the next dispatch can identify it
        if: steps.prepare.outcome == 'success' && steps.verify_patches.outcome == 'success'
        run: persona/scripts/ps307_tree_state.sh seal patched
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          PATCH_DIR: persona/engine/patches/fingerprint

      # THE SECOND RESULT, AND THE ONE THIS TICKET EXISTS TO PRODUCE. Whether
      # the tree our patches produced actually COMPILES. Reached only when the
      # patches applied — a compile attempt on a half-patched tree would
      # manufacture failures belonging to neither result.
      #
      # PS-307 ADDED THE SECOND CONDITION, and it is not redundant with the
      # first. `prepare` succeeding says the patch pipeline RAN without error; on
      # a preserved tree it also succeeds when `apply_patches()` skipped itself
      # entirely and applied nothing. Only `verify_patches` says our 16 are in
      # the tree. Ordering alone would not gate this — a later step with its own
      # `if:` still runs after an earlier failure — so the dependency is written
      # into the condition.
      - name: Compile — THE NUMBER THIS TICKET EXISTS TO PRODUCE
        id: compile
        if: steps.prepare.outcome == 'success' && steps.verify_patches.outcome == 'success'
        continue-on-error: true
        run: persona/scripts/ps218_build.sh compile patched
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          NINJA_JOBS: ${{ inputs.ninja_jobs }}

      # The control's compile log is produced by the OTHER job, so it must be
      # brought in EXPLICITLY. It lands in `control/`, not `record/`, precisely
      # so a leftover in the shared workspace can never be mistaken for it: the
      # attribution script reads only this directory and refuses anything whose
      # provenance stamp does not name this run — or, on a patched-only
      # dispatch, does not carry the borrow certificate proving another run's
      # control was checked and passed.
      #
      # `continue-on-error` because the control may legitimately not exist (the
      # unmodified tree failed to prepare, so no compile log was produced). That
      # case is already handled — every error is then marked CONTROL UNKNOWN
      # rather than asserted as ours.
      #
      # PS-244: SCOPED TO `both`, AND THAT SCOPE IS LOAD-BEARING. On a
      # patched-only dispatch the control was already fetched and VERIFIED near
      # the top of this job. Letting this step run there would download over the
      # verified directory — replacing checked bytes with unchecked ones after
      # the check had passed, which is a TOCTOU that would defeat the entire
      # verification. It would also resolve against the current run, which on
      # that path has no unmodified artifact at all.
      - name: Fetch the control's compile log (for the control diff)
        if: inputs.trees == 'both'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ps218-unmodified-${{ inputs.ungoogled_tag }}
          path: control

      # Attribute every compile error to the patch that touched the file, and
      # diff against the unmodified tree's errors so a failure the CONTROL also
      # had is never billed to one of our patches.
      - name: Attribute compile failures to patches
        if: always()
        run: persona/scripts/ps218_attribute.sh
        env:
          UCPL_DIR: ucpl
          PATCH_DIR: persona/engine/patches/fingerprint
          CONTROL_DIR: control
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}

      - name: Write the manifest
        if: always()
        run: persona/scripts/ps218_manifest.sh patched
        env:
          UCPL_DIR: ucpl
          UNGOOGLED_TAG: ${{ inputs.ungoogled_tag }}
          NINJA_JOBS: ${{ inputs.ninja_jobs }}
          PREPARE_RESULT: ${{ steps.prepare.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          # PS-307 — a reused tree changes what the prepare wall-clock MEANS.
          TREE_REUSED: ${{ steps.tree.outputs.reused }}
          # PS-307 — the manifest's "16 fingerprint patches" row is a CLAIM about
          # the artifact, and this is what backs it. Without it the row rests on
          # the staging step having run, which on a preserved tree is exactly the
          # thing that can be true while the patches are absent.
          PATCHES_VERIFIED: ${{ steps.verify_patches.outcome }}
          # Empty on the `both` path, which is what makes the manifest say
          # IN-RUN there and name the borrowed run here.
          CONTROL_RUN_ID: ${{ inputs.trees == 'patched' && inputs.control_run_id || '' }}

      # PS-244 — THE ARTIFACT NAME CARRIES THE PROVENANCE.
      # A reader browsing the run's artifacts must be able to tell an attribution
      # backed by an in-run control from one backed by a borrowed one WITHOUT
      # opening the workflow, the manifest, or this file. The `both` path keeps
      # exactly its old name, so nothing about the safe path changes; a borrowed
      # run is named for what it is and for WHICH run it leaned on.
      - name: Upload the record (patched)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps218-patched-${{ inputs.ungoogled_tag }}${{ inputs.trees == 'patched' && format('-borrowed-control-{0}', inputs.control_run_id) || '' }}
          path: |
            record/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the binary (patched, only if it exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps218-patched-binary-${{ inputs.ungoogled_tag }}
          path: |
            ucpl/build/src/out/Default/chrome
            ucpl/build/src/out/Default/chromedriver
          if-no-files-found: ignore
          retention-days: 7

      - name: Re-raise a failure now that the evidence is collected
        if: steps.prepare.outcome == 'failure' || steps.verify_patches.outcome == 'failure' || steps.compile.outcome == 'failure'
        run: |
          if [ "${{ steps.verify_patches.outcome }}" = "failure" ]; then
            echo "::error::PS-307: the tree does NOT carry our full fingerprint patch layer, so nothing was compiled from it."
            echo "::error::PS-307: this is the failure tree reuse makes possible — a preserved, already-stamped tree lets upstream's apply_patches() skip itself, and the build would then be labelled as carrying 16 patches while carrying fewer."
            echo "::error::PS-307: see record/patch-presence-patched.txt for which patches were missing and which evidence failed. The tree has NOT been sealed, so the next dispatch rebuilds it."
            exit 1
          fi
          echo "::error::PATCHED tree did not build (prepare=${{ steps.prepare.outcome }}, compile=${{ steps.compile.outcome }})."
          echo "::error::The unmodified control DID build, so this failure is attributable to our 16 patches. See record/attribution.txt for the per-patch breakdown."
          echo "::error::Per PS-218 this is a SUCCESSFUL OUTCOME for the ticket: it is the number the ticket exists to produce. Do NOT drop a patch to make this go green."
          exit 1
