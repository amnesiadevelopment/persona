name: ps60-recon

# TEMPORARY reconnaissance workflow for PS-60. Deleted before the PR is opened.
# Answers, by measurement rather than assumption:
#   1. what macos-latest actually IS (arm64 vs x86_64)
#   2. whether `pip install .` succeeds on each of the three platforms
#   3. the suite's environmental failure floor on each platform
#   4. whether a real Firefox launches headless with NO display server
on:
  workflow_dispatch:
  # workflow_dispatch only works once the file is on the default branch, which
  # this throwaway never reaches. A branch push trigger is how it actually runs.
  push:
    branches:
      - "feature/PS-60-*"

permissions:
  contents: read

jobs:
  recon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      - name: Machine facts
        shell: bash
        run: |
          echo "=== RECON: machine ==="
          python -c "import platform,sys; print('platform:', platform.platform()); print('machine :', platform.machine()); print('python  :', sys.version)"
          node --version
          echo "DISPLAY=[${DISPLAY:-<unset>}]"

      - name: Install deps (identical to ci.yml / release.yml)
        id: install
        shell: bash
        continue-on-error: true
        run: |
          echo "=== RECON: install ==="
          python -m pip install --upgrade pip
          pip install --prefer-binary .
          pip check
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi
          echo "INSTALL_OK"

      - name: Suite floor
        shell: bash
        continue-on-error: true
        run: |
          echo "=== RECON: suite floor on ${{ matrix.os }} ==="
          python -m pytest -q -p no:randomly 2>&1 | tail -60

      - name: Browser binary + headless launch with NO display
        shell: bash
        continue-on-error: true
        run: |
          echo "=== RECON: playwright firefox ==="
          python -m playwright install firefox 2>&1 | tail -5 || echo "PLAYWRIGHT_INSTALL_FAILED"
          echo "--- launching with DISPLAY deliberately unset ---"
          unset DISPLAY
          python - <<'PY' 2>&1 | tail -30
          try:
              from playwright.sync_api import sync_playwright
          except Exception as exc:
              print("IMPORT_FAILED:", exc); raise SystemExit(0)
          try:
              with sync_playwright() as p:
                  b = p.firefox.launch()
                  pg = b.new_page()
                  pg.goto("data:text/html,<title>x</title>")
                  print("LAUNCH_OK ua=", pg.evaluate("navigator.userAgent"))
                  b.close()
          except Exception as exc:
              print("LAUNCH_FAILED:", type(exc).__name__, str(exc)[:600])
          PY

      - name: Browser probes under a DECLARED capability
        shell: bash
        continue-on-error: true
        env:
          PERSONA_REQUIRED_CAPABILITIES: browser
        run: |
          echo "=== RECON: declared-capability browser probes ==="
          python -m pytest -q tests/test_ff_language_override.py 2>&1 | tail -40
