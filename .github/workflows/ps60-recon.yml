name: ps60-recon

# TEMPORARY reconnaissance workflow for PS-60. Deleted before the PR is opened.
# Round 2: capture the FULL Windows failure list (round 1's `tail -60` truncated
# 14 of the 22) and classify it, so the floor can be reported per-cause rather
# than as a bare number.
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/PS-60-*"

permissions:
  contents: read

jobs:
  recon:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary .
          pip check
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      - name: Full failure list, untruncated
        shell: bash
        continue-on-error: true
        run: |
          python -m pytest -q > /tmp/full.txt 2>&1 || true
          echo "=================== EVERY FAILED LINE ==================="
          grep -E '^FAILED' /tmp/full.txt || echo "(none)"
          echo "=================== TALLY ==================="
          grep -cE '^FAILED' /tmp/full.txt || true
          tail -3 /tmp/full.txt
