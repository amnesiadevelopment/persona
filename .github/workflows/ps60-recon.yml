name: ps60-recon

# TEMPORARY falsification workflow for PS-60. Deleted before the PR is opened.
#
# "A job that has only been observed passing has not been observed." Each new
# gate is broken deliberately, on EACH platform, and must go red naming what
# broke and where. Every step is `continue-on-error` so one job records ALL of
# its evidence in a single run — the recorded outcome per mangle is what
# matters, not this throwaway job's own colour.
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/PS-60-*"

permissions:
  contents: read

jobs:
  falsify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary .
          pip check
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      # ---------------------------------------------------------------
      # MANGLE 1 — the capability gate. The browser binary is deliberately
      # NOT provisioned, while the environment still DECLARES it supplies
      # one. The probes must FAIL (not skip) and name what was missing.
      # This is the gate that makes "did not run" as loud as "failed".
      # ---------------------------------------------------------------
      - name: "MANGLE 1: declared browser capability, binary NOT provisioned"
        shell: bash
        continue-on-error: true
        env:
          PERSONA_REQUIRED_CAPABILITIES: browser
        run: |
          set +e
          python -m pytest -q tests/test_ff_language_override.py > out1.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code"
          grep -E "declared capabilities|must RUN|skip reason|provision it with|FAILED|passed|failed" out1.txt | head -25
          if [ "$code" -eq 0 ]; then echo "MANGLE1_RESULT=ESCAPED (stayed green)"; else echo "MANGLE1_RESULT=CAUGHT"; fi

      # CONTROL for mangle 1: the SAME command with the capability NOT
      # declared must stay GREEN (an ordinary developer run still skips and
      # still passes). Without this control, a gate that fails everything
      # would look identical to one that works.
      - name: "CONTROL 1: no declaration, same missing binary -> must be GREEN"
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q tests/test_ff_language_override.py > outc.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code"
          tail -3 outc.txt
          if [ "$code" -eq 0 ]; then echo "CONTROL1_RESULT=GREEN (correct)"; else echo "CONTROL1_RESULT=WRONG (an undeclared run must still pass)"; fi

      - name: Provision the browser engine
        shell: bash
        run: python -m playwright install firefox

      # CONTROL 2: with the binary provisioned AND the capability declared,
      # the probes must RUN and pass. This is the healthy control that proves
      # the gate discriminates rather than simply failing everything.
      - name: "CONTROL 2: provisioned + declared -> probes must RUN"
        shell: bash
        continue-on-error: true
        env:
          PERSONA_REQUIRED_CAPABILITIES: browser
        run: |
          set +e
          python -m pytest -q tests/test_ff_language_override.py > out2.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code"
          grep -E "declared capabilities|^ok browser|passed|failed" out2.txt | head -10
          if [ "$code" -eq 0 ]; then echo "CONTROL2_RESULT=GREEN (probes ran)"; else echo "CONTROL2_RESULT=RED"; fi

      # ---------------------------------------------------------------
      # MANGLE 2 — the suite gate itself. A deliberately broken test must
      # take the job red and NAME the test that broke, on this platform.
      # ---------------------------------------------------------------
      - name: "MANGLE 2: a deliberately broken test must go red and name itself"
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p tests
          cat > tests/test_ps60_deliberate_break.py <<'EOF'
          def test_ps60_deliberate_break_marker():
              assert False, "PS60_DELIBERATE_BREAK on this platform"
          EOF
          python -m pytest -q tests/test_ps60_deliberate_break.py > out3.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code"
          grep -E "PS60_DELIBERATE_BREAK|FAILED|failed" out3.txt | head -10
          rm -f tests/test_ps60_deliberate_break.py
          if [ "$code" -eq 0 ]; then echo "MANGLE2_RESULT=ESCAPED"; else echo "MANGLE2_RESULT=CAUGHT"; fi

      # ---------------------------------------------------------------
      # MANGLE 3 — an unknown capability name must be a HARD ERROR, not a
      # silent no-op. A typo that quietly disabled the guard would be the
      # original defect wearing a new hat.
      # ---------------------------------------------------------------
      - name: "MANGLE 3: a typo'd capability must be refused loudly"
        shell: bash
        continue-on-error: true
        env:
          PERSONA_REQUIRED_CAPABILITIES: browzer
        run: |
          set +e
          python -m pytest -q tests/test_ff_language_override.py > out4.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code"
          grep -E "unknown test capability|Known capabilities|error" out4.txt | head -5
          if [ "$code" -eq 0 ]; then echo "MANGLE3_RESULT=ESCAPED (typo silently ignored)"; else echo "MANGLE3_RESULT=CAUGHT"; fi

      # ---------------------------------------------------------------
      # The GPU reading: recorded on every platform, exits 0 even though the
      # pair is present, and never counted as a pass.
      # ---------------------------------------------------------------
      - name: "GPU reading: must report the pair and still exit 0"
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python .github/scripts/report_runner_gpu.py
          echo "GPU_EXIT_CODE=$?"
