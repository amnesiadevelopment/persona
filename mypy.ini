; Type-checking configuration.
;
; THE INVOCATION LIVES HERE, NOT IN A WORKFLOW LINE (PS-165). A developer
; running `python3 -m mypy src` locally must get the SAME answer CI does. Every
; flag this check needs is therefore a config key below rather than an argument
; buried in ci.yml, because a flag that exists only in the workflow is a flag
; local runs silently omit — and a checker that disagrees with itself depending
; on who invoked it is worse than no checker.
;
; MEASURED at PS-165 (mypy 2.3.1, Python 3.12): the two settings below are
; equivalent to passing `--no-site-packages --ignore-missing-imports` on the
; command line — the run is byte-identical whether the flags are read from here
; or given as arguments. That equivalence is the point of this file.
;
; The advisory error count this produces is NOT recorded here on purpose. It
; moves whenever the code or the mypy pin moves, and a number frozen in a
; comment goes stale silently and is then quoted as current. Read it from the
; run: `python3 -m mypy --config-file mypy.ini src`. (For the record, the
; pre-PS-165 tree at b018988 reported 136 errors in 33 files; PS-165 closed the
; protocol-drift class and the count moved. Treat that figure as history,
; not as a description of this config's output today.)

[mypy]
python_version = 3.11

; WHY no_site_packages IS REQUIRED, not a preference. Without it mypy follows
; imports into installed third-party packages, and one of them does not parse
; under this Python:
;
;   invisible_core/prefs.py:290: error: Invalid syntax  [syntax]
;
; A syntax error ABORTS the whole run — mypy reports "errors prevented further
; checking" and exits rc=2 having never finished this repo's code. The naive
; run measured 9 such errors and checked almost nothing. So without this key CI
; would report a meaningless failure about a file that is not ours and that no
; change to this repo can fix.
no_site_packages = True

; THE COMPANION OF THE ABOVE — the two must move together. Excluding
; site-packages from the search path means every third-party import (flet,
; aiohttp, fastapi, ...) becomes unresolvable BY CONSTRUCTION, so without this
; the log fills with import-not-found noise that says nothing about our types.
; This is why the setting is unconditional rather than "only when deps are
; missing": with no_site_packages set, deps being installed makes no difference.
ignore_missing_imports = True

; Historical note: this section was declared TWICE (PS-165). mypy tolerated it
; — a warning on stderr and rc=0, NOT the hard failure configparser raises — so
; the duplicate was a wart rather than the reason mypy went unrun. The real
; reason was that mypy was installed and invoked nowhere. Both bodies were
; byte-identical, so removing one changed no behaviour whatsoever.
[mypy-flet.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True
