[project]
name = "persona"
version = "1.0.0"
description = "Anti-detect browser manager"
requires-python = ">=3.13"
dependencies = [
    "flet==0.85.3",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=42.0.0",
    "mcp>=1.28.0",
    # mcp pulls pywin32 (for pywintypes) only as a platform-conditional
    # TRANSITIVE dep, and flet build doesn't resolve those — so the built
    # Windows app raised "No module named 'pywintypes'" and the MCP control
    # server silently failed to mount (/mcp 404, whole management layer dead).
    # Declare it directly, Windows-only, so the bundle carries it.
    "pywin32>=311; sys_platform == 'win32'",
    # 2nd browser engine (patched Firefox 150). MUST be here, not just in
    # requirements.txt — flet build bundles deps from pyproject, so a package
    # that's only in requirements.txt is missing from the built app (that's
    # exactly why Camoufox showed ModuleNotFoundError in prod).
    "invisible_playwright @ git+https://github.com/feder-cr/invisible_playwright.git",
]

[tool.pytest.ini_options]
# A blocking test must FAIL, not hang the whole run (pytest-timeout, thread
# method on Windows). Generous per-test bound: real WMI/subprocess tests are
# slow but finish well under this.
timeout = 120

[tool.flet]
product = "persona"
org = "dev.persona"
company = "persona"
copyright = "Copyright (c) 2026 persona contributors"
build_number = 1

[tool.flet.app]
path = "."
module = "main"
# hide_window_on_start must NEVER be set here (or in any per-platform app
# section): the build template renders its boot/startup/ERROR screens into
# the app window, and a hidden window can only be shown again by a healthy
# Python session — so any startup failure (a torn app.zip re-extraction
# after a self-update, a poisoned relaunch environment, a dead interpreter)
# becomes an invisible zombie process the user can neither see nor close.
# The window is visible from the client's first frame; the screens below
# give it honest content until the in-app splash takes over as the first
# Python-rendered frame.
exclude = [
    "build",
    "dist",
    ".git",
    ".github",
    "tests",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "persona_data",
    "logs",
    "ci",
]

# Spinner + message while the client extracts app.zip (first launch and the
# first launch after every self-update — the window is up before Python is).
[tool.flet.app.boot_screen]
show = true
message = "Preparing persona…"

# Spinner + message while the Python session boots and connects.
[tool.flet.app.startup_screen]
show = true
message = "Starting persona…"
