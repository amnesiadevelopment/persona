[project]
name = "persona"
version = "1.0.0"
description = "Anti-detect browser manager"
requires-python = ">=3.13"
dependencies = [
    "flet==0.85.3",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=42.0.0",
    # Cap below 2.0: mcp 2.x removed the mcp.server.fastmcp path we import
    # (build_mcp uses FastMCP), so an unpinned >=1.28.0 let the macOS build
    # resolve 2.x and raise ModuleNotFoundError, silently killing the /mcp server.
    "mcp>=1.28.0,<2",
    # mcp pulls pywin32 (for pywintypes) only as a platform-conditional
    # TRANSITIVE dep, and flet build doesn't resolve those — so the built
    # Windows app raised "No module named 'pywintypes'" and the MCP control
    # server silently failed to mount (/mcp 404, whole management layer dead).
    # Declare it directly, Windows-only, so the bundle carries it.
    "pywin32>=311; sys_platform == 'win32'",
    # SSH/SFTP/tmux "Connect" feature — module-level imports in
    # services/ssh/client.py; only in requirements.txt would miss the built app.
    "paramiko>=3.4",
    "PySocks>=1.7",
    # Peer verification for the two loopback listeners (proxy bridge + mTLS
    # terminator). It resolves an accepted loopback connection to the browser
    # process tree that owns it, so a local caller that is not the browser gets
    # neither authenticated egress nor an mTLS handshake with the operator's
    # client certificate. Present today only as a TRANSITIVE dep of
    # invisible_core; declared here because flet build resolves deps from
    # pyproject, and a bundle without it degrades to "no verification".
    "psutil>=5.9",
    # 2nd browser engine (patched Firefox 150). MUST be here, not just in
    # requirements.txt — flet build bundles deps from pyproject, so a package
    # that's only in requirements.txt is missing from the built app (that's
    # exactly why Camoufox showed ModuleNotFoundError in prod).
    # Pinned to an exact commit (not a floating branch) so a supply-chain push to
    # the upstream repo can't land in a build unverified. This is the commit the
    # test suite is green against and that pins invisible_core==20.14.0 below; bump
    # both together after re-running the suite.
    "invisible_playwright @ git+https://github.com/feder-cr/invisible_playwright.git@353df4faac4fb202cc4d836c46d981855ecf1bd9",
    # invisible_core is invisible_playwright's own dependency, but flet build does
    # NOT resolve a git package's transitive deps — so it must be declared here or
    # the bundle ships without it and the engine raises ImportError ("invisible-core
    # is missing") and reads as "not ready" forever. It must be the EXACT version
    # invisible_playwright pins (its dependencies list carries invisible_core==NN),
    # so the version carrying the release-pin check (invisible_core._pin) lands in
    # the build. A git pin here mismatched playwright's == pin; the PyPI == pin keeps
    # them in lockstep and lets `pip check` catch a drift before release.
    "invisible_core==20.14.0",
]

[tool.pytest.ini_options]
# A blocking test must FAIL, not hang the whole run (pytest-timeout, thread
# method on Windows). Generous per-test bound: real WMI/subprocess tests are
# slow but finish well under this.
timeout = 120

[tool.flet]
product = "persona"
org = "dev.persona"
company = "persona"
copyright = "Copyright (c) 2026 persona contributors"
build_number = 1

[tool.flet.app]
path = "."
module = "main"
# Start the window HIDDEN so the user never sees the client's default-sized,
# off-centre, corner-positioned boot/startup spinner nor the jump to centre once
# Python takes over — the window appears already-centred with persona's own
# fingerprint-scan splash as the very first frame the user sees.
#
# MUST be false on macOS. Flet 0.85.3's "merged UI and platform thread" mode
# (macOS desktop) deadlocks the native launch when the window starts hidden: on a
# LaunchServices ('open') launch the platform thread waits for the hidden window
# to become ready before it runs runPython, and that readiness never fires while
# hidden — so Python's main() NEVER starts and the app is an invisible zombie
# (0 windows, process alive, no log). VERIFIED on a Mac build: with
# hide_window_on_start=true the built .app zombied on every 'open'; flipping it to
# false made the same build launch, run main(), and paint a centred window.
# (Binary-direct launch masked the bug — it ran Python fine either way.)
# The window now appears from the first native frame; main.py still centres it and
# the in-app splash is the first real content, so there is no hidden-zombie path.
# NOTE for Win/Linux: verify the brief window-before-splash frame looks clean;
# those platforms did not need hide=true for correctness, only cosmetics.
hide_window_on_start = false
exclude = [
    "build",
    "dist",
    ".git",
    ".github",
    "tests",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "persona_data",
    "logs",
    "ci",
]

# The window is hidden until Python paints its first frame (see
# hide_window_on_start above), so the client's pre-Python boot/startup spinners
# would never be seen anyway — turn them off. The in-app fingerprint-scan splash
# is the first thing the user sees, already centred. The boot screen (app.zip
# extract after an update) is also hidden; that extract is brief and the window
# simply appears once persona's own splash is ready.
[tool.flet.app.boot_screen]
show = false

[tool.flet.app.startup_screen]
show = false
