[project]
name = "persona"
version = "1.0.0"
description = "Anti-detect browser manager"
requires-python = ">=3.13"
dependencies = [
    "flet==0.85.3",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=42.0.0",
    "mcp>=1.28.0",
    # 2nd browser engine (patched Firefox 150). MUST be here, not just in
    # requirements.txt — flet build bundles deps from pyproject, so a package
    # that's only in requirements.txt is missing from the built app (that's
    # exactly why Camoufox showed ModuleNotFoundError in prod).
    "invisible_playwright @ git+https://github.com/feder-cr/invisible_playwright.git",
]

[tool.pytest.ini_options]
# A blocking test must FAIL, not hang the whole run (pytest-timeout, thread
# method on Windows). Generous per-test bound: real WMI/subprocess tests are
# slow but finish well under this.
timeout = 120

[tool.flet]
product = "persona"
org = "dev.persona"
company = "persona"
copyright = "Copyright (c) 2026 persona contributors"
build_number = 1

[tool.flet.app]
path = "."
module = "main"
# Keep the Flutter window hidden while Python boots: without this it opens
# seconds before the app can paint anything — a bare dark rectangle (worst
# right after a self-update, when app.zip re-extracts). flet has no native
# desktop splash (flutter_native_splash is iOS/Android/web only), so the
# window is revealed from app.py once the scan splash is its first frame.
hide_window_on_start = true
exclude = [
    "build",
    "dist",
    ".git",
    ".github",
    "tests",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "persona_data",
    "logs",
    "ci",
]
