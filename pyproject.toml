[project]
name = "persona"
version = "1.0.0"
description = "Anti-detect browser manager"
requires-python = ">=3.13"
dependencies = [
    "flet==0.85.3",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # UPPER BOUND IS macOS PACKAGING, NOT A SECURITY PREFERENCE — and it is a
    # MEASURED mechanism, not a guess at one. Do not lift it without re-reading
    # the wheel matrix below; a bare `>=42.0.0` ships a BROKEN macOS bundle.
    #
    # flet/serious_python builds macOS as TWO INDEPENDENT pip resolutions and
    # then merges them (package_command.dart -> macos_utils.mergeMacOsSitePackages):
    #     build/site-packages/arm64   <- resolved for macosx_11_0_arm64
    #     build/site-packages/x86_64  <- resolved for macosx_10_9_x86_64
    # cryptography 49.0.0 (2026-06-12) DROPPED the macosx universal2 wheel and
    # ships arm64-only from then on. So the two passes cannot agree:
    #     arm64  >=42.0.0 -> cryptography-50.0.0-cp311-abi3-macosx_11_0_arm64.whl
    #     x86_64 >=42.0.0 -> cryptography-48.0.1-cp311-abi3-macosx_10_9_universal2.whl
    # (both reproduced exactly with pip's own resolver — this IS the observed pair).
    #
    # The merge then makes the disagreement invisible instead of loud. It lipo's
    # or copies file-by-file, and cryptography's compiled extension is named
    # `_rust.abi3.so` — a STABLE-ABI, VERSION-AGNOSTIC filename. The x86_64 copy
    # therefore overwrites the arm64 copy at the same path while 50.0.0's Python
    # files and .dist-info survive, producing ONE bundle whose metadata says
    # 50.0.0 and whose shared object says 48.0.1. cryptography checks exactly
    # that at import and raises, which is what killed the 3.0.0 release:
    #   "The version of cryptography does not match the loaded shared object.
    #    Loaded python version: 50.0.0, shared object version: b'48.0.1'"
    # NOTE for anyone who reads `abi3` as "safe": abi3 protects against an
    # INTERPRETER-version mismatch and nothing else. It is precisely what let two
    # different LIBRARY versions collide on one filename without a rename.
    #
    # <49 keeps both arches on the last universal2 line (48.0.x), so ONE version
    # satisfies both passes and the merge is a no-op instead of a corruption.
    #
    # THE CAP IS SCOPED TO darwin, AND THAT SCOPE IS LOAD-BEARING. The mechanism
    # above is macOS-ONLY: it exists because flet builds macOS as TWO arch passes
    # and merges them. Windows and Linux each run a SINGLE resolution pass, have
    # no merge step, and therefore cannot hit this failure at all.
    # Measured with pip's own resolver against the four targets we ship:
    #     >=42.0.0        arm64  -> 50.0.0 | x86_64 -> 48.0.1   <- the collision
    #     >=42.0.0        win    -> 50.0.0 | linux  -> 50.0.0
    #     >=42.0.0,<49    win    -> 48.0.1 | linux  -> 48.0.1   <- CHANGED
    # So an UNCONDITIONAL cap does NOT cost the other two platforms nothing — it
    # silently drags both back two major versions of a SECURITY library, onto a
    # version neither has ever built against. Linux was the one platform that
    # passed 11/11 imports in the failed 3.0.0 run (on 50.0.0); re-resolving it
    # to fix macOS would convert that measurement back into an assumption.
    # An earlier revision of this file made exactly that claim and it was false.
    # Keep the marker. If you are tempted to simplify these two lines into one,
    # that is the mistake this paragraph exists to stop.
    #
    # It is a RANGE, not an == pin, so 48.0.x security patches still land — and
    # non-darwin stays fully open, so Windows/Linux keep tracking latest.
    #
    # The way OUT of this bound is a product decision, not a packaging one:
    # either cryptography restores universal2, or persona drops Intel macOS and
    # builds `--arch arm64` only. Until one of those happens, this stays.
    "cryptography>=42.0.0,<49; sys_platform == 'darwin'",
    "cryptography>=42.0.0; sys_platform != 'darwin'",
    # Cap below 2.0: mcp 2.x removed the mcp.server.fastmcp path we import
    # (build_mcp uses FastMCP), so an unpinned >=1.28.0 let the macOS build
    # resolve 2.x and raise ModuleNotFoundError, silently killing the /mcp server.
    "mcp>=1.28.0,<2",
    # mcp pulls pywin32 (for pywintypes) only as a platform-conditional
    # TRANSITIVE dep, and flet build doesn't resolve those — so the built
    # Windows app raised "No module named 'pywintypes'" and the MCP control
    # server silently failed to mount (/mcp 404, whole management layer dead).
    # Declare it directly, Windows-only, so the bundle carries it.
    "pywin32>=311; sys_platform == 'win32'",
    # SSH/SFTP/tmux "Connect" feature — module-level imports in
    # services/ssh/client.py; only in requirements.txt would miss the built app.
    "paramiko>=3.4",
    "PySocks>=1.7",
    # Peer verification for the two loopback listeners (proxy bridge + mTLS
    # terminator). It resolves an accepted loopback connection to the browser
    # process tree that owns it, so a local caller that is not the browser gets
    # neither authenticated egress nor an mTLS handshake with the operator's
    # client certificate. Present today only as a TRANSITIVE dep of
    # invisible_core; declared here because flet build resolves deps from
    # pyproject, and a bundle without it degrades to "no verification".
    # >=6.0 is a SECURITY floor, not a preference: core/peerauth.py calls
    # Process.net_connections(), which does not exist before 6.0.0 (5.9.x names
    # it Process.connections()). On an older resolution the peer-authentication
    # gate cannot enumerate sockets and both loopback listeners stop
    # authenticating their caller. Do not lower it.
    "psutil>=6.0",
    # 2nd browser engine (patched Firefox 150). MUST be here, not just in
    # requirements.txt — flet build bundles deps from pyproject, so a package
    # that's only in requirements.txt is missing from the built app (that's
    # exactly why Camoufox showed ModuleNotFoundError in prod).
    # Pinned to an exact commit (not a floating branch) so a supply-chain push to
    # the upstream repo can't land in a build unverified. This is the commit the
    # test suite is green against and that pins invisible_core==20.14.0 below; bump
    # both together after re-running the suite.
    "invisible_playwright @ git+https://github.com/feder-cr/invisible_playwright.git@353df4faac4fb202cc4d836c46d981855ecf1bd9",
    # invisible_core is invisible_playwright's own dependency, but flet build does
    # NOT resolve a git package's transitive deps — so it must be declared here or
    # the bundle ships without it and the engine raises ImportError ("invisible-core
    # is missing") and reads as "not ready" forever. It must be the EXACT version
    # invisible_playwright pins (its dependencies list carries invisible_core==NN),
    # so the version carrying the release-pin check (invisible_core._pin) lands in
    # the build. A git pin here mismatched playwright's == pin; the PyPI == pin keeps
    # them in lockstep and lets `pip check` catch a drift before release.
    "invisible_core==20.14.0",
]

[tool.pytest.ini_options]
# A blocking test must FAIL, not hang the whole run (pytest-timeout, thread
# method on Windows). Generous per-test bound: real WMI/subprocess tests are
# slow but finish well under this.
#
# READ THIS BEFORE RELYING ON THE LINE ABOVE. `timeout` is an ini key belonging
# to pytest-timeout, and pytest IGNORES an ini key whose plugin is not loaded.
# So this bound exists only where that plugin does. It is declared in
# requirements-dev.txt (which .github/workflows/ci.yml installs), so CI is
# bounded; an environment that installs only the project is NOT, and for a long
# time nothing said so. PS-104 measured the cost of that silence: a UI-driver
# test wedged for 25 minutes in an environment where this comment promised two.
#
# The disagreement is no longer silent. conftest.py's pytest_report_header
# prints `per-test timeout: ACTIVE` or `INERT` on EVERY run, keyed on whether
# the plugin is actually active in that run rather than on whether it could be
# imported — an installed-but-disabled plugin (`-p no:timeout`) enforces
# nothing and must not read as bounded.
#
# The same caveat applies to every `@pytest.mark.timeout(...)` in the suite: an
# unknown marker is inert metadata, so those bounds die with the plugin too.
# The tests that spawn EXTERNAL children (tests/test_ui_driven*.py — a flet web
# server and a playwright node driver) therefore do not depend on it at all;
# they bound themselves and reap their children via tests/ui_driver/watchdog.py.
# That is deliberate: a thread-based timeout is weakest exactly where the
# blocking wait is inside a child process rather than in the test thread.
timeout = 120
# Every run says what it did NOT do. Without this, a skip and a pass are the
# same green to every reader — including the release pipeline, which runs the
# suite and reads only its exit code. The real-Firefox probes in
# tests/test_ff_language_override.py are guarded twice and both guards resolve
# to a skip, so the suite's strongest evidence could decline to run
# indefinitely and report success.
#
# `s` = skipped (with the reason each gave), `f` = failed, `E` = errored.
# The f and E are NOT decoration: `-r` REPLACES the default summary set, so a
# bare `-rs` prints skip reasons and then SUPPRESSES the list of failed test
# names, trading one blindness for another. Measured on this suite: `-rs`
# rendered 30 failures as an aggregate count with no names.
#
# This is the project's ONE pytest config site — there is no pytest.ini,
# setup.cfg or tox.ini. Keep it that way: a flag added to a CI invocation
# instead of here drifts from what a developer sees locally.
addopts = "-rsfE"

[tool.flet]
product = "persona"
org = "dev.persona"
company = "persona"
copyright = "Copyright (c) 2026 persona contributors"
build_number = 1

[tool.flet.app]
path = "."
module = "main"
# Start the window HIDDEN so the user never sees the client's default-sized,
# off-centre, corner-positioned boot/startup spinner nor the jump to centre once
# Python takes over — the window appears already-centred with persona's own
# fingerprint-scan splash as the very first frame the user sees.
#
# MUST be false on macOS. Flet 0.85.3's "merged UI and platform thread" mode
# (macOS desktop) deadlocks the native launch when the window starts hidden: on a
# LaunchServices ('open') launch the platform thread waits for the hidden window
# to become ready before it runs runPython, and that readiness never fires while
# hidden — so Python's main() NEVER starts and the app is an invisible zombie
# (0 windows, process alive, no log). VERIFIED on a Mac build: with
# hide_window_on_start=true the built .app zombied on every 'open'; flipping it to
# false made the same build launch, run main(), and paint a centred window.
# (Binary-direct launch masked the bug — it ran Python fine either way.)
# The window now appears from the first native frame; main.py still centres it and
# the in-app splash is the first real content, so there is no hidden-zombie path.
# NOTE for Win/Linux: verify the brief window-before-splash frame looks clean;
# those platforms did not need hide=true for correctness, only cosmetics.
hide_window_on_start = false
exclude = [
    "build",
    "dist",
    ".git",
    ".github",
    "tests",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "persona_data",
    "logs",
    "ci",
]

# The window is hidden until Python paints its first frame (see
# hide_window_on_start above), so the client's pre-Python boot/startup spinners
# would never be seen anyway — turn them off. The in-app fingerprint-scan splash
# is the first thing the user sees, already centred. The boot screen (app.zip
# extract after an update) is also hidden; that extract is brief and the window
# simply appears once persona's own splash is ready.
[tool.flet.app.boot_screen]
show = false

[tool.flet.app.startup_screen]
show = false
